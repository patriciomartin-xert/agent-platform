version: '3.8'

# ==============================================================================
# OPALO / GROK BOT ENTERPRISE CLONE - DOCKER COMPOSE ORCHESTRATION
# Architecture: Microservices, Sandboxed Execution, Vector Memory & Realtime PubSub
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE & VECTOR MEMORY: PostgreSQL 16 + pgvector
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grok_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grok_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grok_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-grok_enterprise_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grok_admin} -d ${POSTGRES_DB:-grok_enterprise_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agent-internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ----------------------------------------------------------------------------
  # 2. CACHE, PUB/SUB & SESSION STORE: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: grok_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ----------------------------------------------------------------------------
  # 3. ISOLATED TOOL SERVER & BROWSER SANDBOX (Playwright + MCP)
  # ----------------------------------------------------------------------------
  tools-server:
    build:
      context: ./tools-server
      dockerfile: Dockerfile
    container_name: grok_tools_server
    restart: unless-stopped
    environment:
      PORT: 8001
      WORKSPACE_DIR: /workspace
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-True}
      PLAYWRIGHT_TIMEOUT_MS: ${PLAYWRIGHT_TIMEOUT_MS:-30000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8001:8001"
    volumes:
      # Sandboxed directory mounted strictly to isolated agent workspace
      - sandbox_workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agent-internal
      - agent-public
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G

  # ----------------------------------------------------------------------------
  # 4. BACKEND ORCHESTRATOR: FastAPI + LangGraph Stateful Multi-Agent Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grok_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-grok_admin}:${POSTGRES_PASSWORD:-grok_secure_password_2026}@postgres:5432/${POSTGRES_DB:-grok_enterprise_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password}@redis:6379/0
      TOOLS_SERVER_URL: http://tools-server:8001
      WORKSPACE_DIR: /workspace
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      CRITICAL_TOOLS_REQUIRE_APPROVAL: ${CRITICAL_TOOLS_REQUIRE_APPROVAL:-exec_command,delete_file,write_file,submit_payment_form}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sandbox_workspace:/workspace:ro # Read-only view for backend; executions happen in tools-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tools-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agent-internal
      - agent-public
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ----------------------------------------------------------------------------
  # 5. FRONTEND: React 18 + TypeScript + Vite + Tailwind CSS (Interactive Canvas)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grok_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000/ws/agent}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - agent-public
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

# ==============================================================================
# VOLUMES & PERSISTENCE
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  sandbox_workspace:
    driver: local

# ==============================================================================
# NETWORKS CONFIGURATION (Network Segregation for Security)
# ==============================================================================
networks:
  agent-internal:
    driver: bridge
    internal: false # internal services communication (DB, Redis, Backend, Tools)
  agent-public:
    driver: bridge # external facing routing (Backend API, WebSocket, Frontend)
