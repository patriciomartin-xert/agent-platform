<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ópalo OS - Autonomous Agent Enterprise Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #080c14;
      color: #e2e8f0;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 99px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    .tree-line {
      position: absolute;
      background: #334155;
    }
  </style>
</head>
<body class="min-h-screen flex antialiased overflow-hidden select-none">

  <div id="root" class="flex-1 flex overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Views: 'workspace' | 'organigram' | 'plugins'
      const [currentView, setCurrentView] = useState('workspace');

      // Core State
      const [agents, setAgents] = useState({});
      const [selectedAgentId, setSelectedAgentId] = useState('');
      const [channels, setChannels] = useState([]);
      const [selectedChannel, setSelectedChannel] = useState('all');
      const [plugins, setPlugins] = useState([]);
      const [routines, setRoutines] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [interAgentLogs, setInterAgentLogs] = useState([]);

      // Workspace Right Tab: 'computer' | 'routines' | 'plugins' | 'settings'
      const [rightTab, setRightTab] = useState('computer');

      // AI Engine & API Key status
      const [aiConfig, setAiConfig] = useState({ hasKey: false, keyMasked: '', provider: 'Google Gemini' });
      const [showAiModal, setShowAiModal] = useState(false);
      const [aiKeyInput, setAiKeyInput] = useState('');
      const [aiTesting, setAiTesting] = useState(false);
      const [aiTestMessage, setAiTestMessage] = useState(null);

      // Edit Agent Form (Settings Tab)
      const [editAgentForm, setEditAgentForm] = useState({
        name: '',
        role: '',
        department: 'Dirección General',
        reportsTo: 'none',
        jobDescription: '',
        computerUrl: ''
      });
      const [isSavingAgent, setIsSavingAgent] = useState(false);
      const [saveSuccessMsg, setSaveSuccessMsg] = useState('');

      // Chat input & voice recording
      const [chatInput, setChatInput] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [isSending, setIsSending] = useState(false);
      const [browserUrl, setBrowserUrl] = useState('https://dashboard.opalo.ai');

      // Modals
      const [showNewAgentModal, setShowNewAgentModal] = useState(false);
      const [showConfigurePluginModal, setShowConfigurePluginModal] = useState(null);
      const [newAgentParentId, setNewAgentParentId] = useState('none');
      const [newAgentForm, setNewAgentForm] = useState({
        name: '',
        role: '',
        department: 'Dirección General',
        channelId: 'direccion',
        reportsTo: 'none',
        isCoordinator: false,
        avatarEmoji: '🤖',
        jobDescription: '',
        computerType: 'browser',
        computerUrl: 'https://dashboard.opalo.ai',
        plugins: []
      });

      const chatEndRef = useRef(null);
      const recognitionRef = useRef(null);

      // Initial Fetch & WebSockets
      useEffect(() => {
        loadData();
        initWebSocket();
        initVoiceRecognition();
      }, []);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [agents, selectedAgentId]);

      // Sync active agent browser URL and edit form
      useEffect(() => {
        const ag = agents[selectedAgentId];
        if (ag) {
          if (ag.computer) {
            setBrowserUrl(ag.computer.currentUrl || 'https://dashboard.opalo.ai');
          }
          setEditAgentForm({
            name: ag.name || '',
            role: ag.role || '',
            department: ag.department || 'Dirección General',
            reportsTo: ag.reportsTo || 'none',
            jobDescription: ag.jobDescription || '',
            computerUrl: ag.computer?.currentUrl || 'https://dashboard.opalo.ai'
          });
        }
      }, [selectedAgentId, agents]);

      const loadData = async () => {
        try {
          const [agRes, chRes, plRes, roRes, exRes, loRes, aiRes] = await Promise.all([
            fetch('/api/grok/agents').then(r => r.json()),
            fetch('/api/grok/channels').then(r => r.json()),
            fetch('/api/grok/plugins').then(r => r.json()),
            fetch('/api/grok/routines').then(r => r.json()),
            fetch('/api/grok/expenses').then(r => r.json()),
            fetch('/api/grok/inter-agent-logs').then(r => r.json()),
            fetch('/api/grok/config/ai').then(r => r.json()).catch(() => ({ success: false }))
          ]);

          if (agRes && agRes.success) {
            const map = {};
            agRes.agents.forEach(a => { map[a.id] = a; });
            setAgents(map);
            if (!selectedAgentId && agRes.agents.length > 0) {
              const root = agRes.agents.find(a => !a.reportsTo) || agRes.agents[0];
              setSelectedAgentId(root.id);
            }
          }
          if (chRes && chRes.success) setChannels(chRes.channels);
          if (plRes && plRes.success) setPlugins(plRes.plugins);
          if (roRes && roRes.success) setRoutines(roRes.routines);
          if (exRes && exRes.success) setExpenses(exRes.expenses);
          if (loRes && loRes.success) setInterAgentLogs(loRes.logs);
          if (aiRes && aiRes.success) setAiConfig(aiRes);
        } catch (e) {
          console.error('[Error fetching data]:', e);
        }
      };

      const initWebSocket = () => {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.event === 'grok_initial_state') {
              const map = {};
              (data.agents || []).forEach(a => { map[a.id] = a; });
              setAgents(map);
              if (data.channels) setChannels(data.channels);
              if (data.plugins) setPlugins(data.plugins);
              if (data.routines) setRoutines(data.routines);
              if (data.expenses) setExpenses(data.expenses);
            } else if (data.event === 'agent_created' || data.event === 'agent_updated') {
              setAgents(prev => ({ ...prev, [data.agent.id]: data.agent }));
            } else if (data.event === 'agent_deleted') {
              setAgents(prev => {
                const copy = { ...prev };
                delete copy[data.agentId];
                return copy;
              });
            } else if (data.event === 'hierarchy_updated') {
              setAgents(prev => {
                if (!prev[data.agentId]) return prev;
                return {
                  ...prev,
                  [data.agentId]: { ...prev[data.agentId], reportsTo: data.reportsTo }
                };
              });
            } else if (data.event === 'plugin_updated') {
              setPlugins(prev => prev.map(p => p.id === data.plugin.id ? data.plugin : p));
            } else if (data.event === 'new_agent_message') {
              setAgents(prev => {
                const target = prev[data.agentId];
                if (!target) return prev;
                return {
                  ...prev,
                  [data.agentId]: {
                    ...target,
                    history: [...(target.history || []), data.message]
                  }
                };
              });
            } else if (data.event === 'expense_registered') {
              setExpenses(prev => [data.expense, ...prev]);
            }
          } catch (e) {
            console.error(e);
          }
        };
      };

      const initVoiceRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const rec = new SpeechRecognition();
          rec.continuous = false;
          rec.interimResults = false;
          rec.lang = 'es-ES';
          rec.onresult = (ev) => {
            const text = ev.results[0][0].transcript;
            setChatInput(prev => (prev ? prev + ' ' + text : text));
            setIsRecording(false);
          };
          rec.onerror = () => setIsRecording(false);
          rec.onend = () => setIsRecording(false);
          recognitionRef.current = rec;
        }
      };

      const toggleVoice = () => {
        if (!recognitionRef.current) {
          alert('Tu navegador no soporta reconocimiento por voz nativo.');
          return;
        }
        if (isRecording) {
          recognitionRef.current.stop();
          setIsRecording(false);
        } else {
          recognitionRef.current.start();
          setIsRecording(true);
        }
      };

      // Send chat
      const handleSendMessage = async (textOverride = null) => {
        const msg = textOverride || chatInput;
        if (!msg.trim() || !selectedAgentId) return;

        setChatInput('');
        setIsSending(true);

        try {
          await fetch('/api/grok/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ agentId: selectedAgentId, message: msg })
          });
          loadData();
        } catch (e) {
          console.error(e);
        } finally {
          setIsSending(false);
        }
      };

      // Create new agent from scratch
      const handleCreateAgentSubmit = async (e) => {
        e.preventDefault();
        try {
          const payload = {
            ...newAgentForm,
            reportsTo: newAgentForm.reportsTo === 'none' ? null : newAgentForm.reportsTo
          };
          const res = await fetch('/api/grok/agents', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success) {
            setShowNewAgentModal(false);
            setSelectedAgentId(data.agent.id);
            setNewAgentForm({
              name: '',
              role: '',
              department: 'Dirección General',
              channelId: 'direccion',
              reportsTo: 'none',
              isCoordinator: false,
              avatarEmoji: '🤖',
              jobDescription: '',
              computerType: 'browser',
              computerUrl: 'https://dashboard.opalo.ai',
              plugins: []
            });
            loadData();
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Save Agent Settings from Right Tab
      const handleSaveAgentSettings = async (e) => {
        if (e) e.preventDefault();
        if (!selectedAgentId) return;
        setIsSavingAgent(true);
        try {
          const payload = {
            name: editAgentForm.name,
            role: editAgentForm.role,
            department: editAgentForm.department,
            reportsTo: editAgentForm.reportsTo === 'none' ? null : editAgentForm.reportsTo,
            jobDescription: editAgentForm.jobDescription,
            computer: {
              ...(agents[selectedAgentId]?.computer || {}),
              currentUrl: editAgentForm.computerUrl
            }
          };
          const res = await fetch(`/api/grok/agents/${selectedAgentId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success) {
            setSaveSuccessMsg('✅ ¡Ajustes guardados con éxito!');
            setTimeout(() => setSaveSuccessMsg(''), 3500);
            loadData();
          }
        } catch (err) {
          console.error(err);
        } finally {
          setIsSavingAgent(false);
        }
      };

      // Save & Test AI Configuration
      const handleSaveAiConfig = async () => {
        if (!aiKeyInput.trim()) return;
        setAiTesting(true);
        setAiTestMessage(null);
        try {
          const res = await fetch('/api/grok/config/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ apiKey: aiKeyInput.trim() })
          });
          const data = await res.json();
          if (data.success) {
            if (data.testResult && data.testResult.success) {
              setAiConfig({ hasKey: true, keyMasked: data.keyMasked, provider: 'Google Gemini (Google AI Studio)' });
              setAiTestMessage({ type: 'success', text: `✅ Conectado y Verificado con éxito: ${data.testResult.message}` });
            } else {
              setAiConfig({ hasKey: false, keyMasked: '', provider: 'Google Gemini (Google AI Studio)' });
              setAiTestMessage({ type: 'error', text: `⚠️ ${data.testResult?.error || 'Clave no válida'}` });
            }
            loadData();
          } else {
            setAiTestMessage({ type: 'error', text: data.error || 'Error al guardar la clave' });
          }
        } catch (err) {
          setAiTestMessage({ type: 'error', text: err.message });
        } finally {
          setAiTesting(false);
        }
      };

      // Change agent's supervisor in organigram
      const handleUpdateHierarchy = async (agentId, newReportsTo) => {
        try {
          await fetch(`/api/grok/agents/${agentId}/hierarchy`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reportsTo: newReportsTo })
          });
          loadData();
        } catch (e) {
          console.error(e);
        }
      };

      // Delete agent
      const handleDeleteAgent = async (agentId) => {
        if (!confirm('¿Eliminar este agente del organigrama?')) return;
        try {
          await fetch(`/api/grok/agents/${agentId}`, { method: 'DELETE' });
          if (selectedAgentId === agentId) {
            const remaining = Object.values(agents).filter(a => a.id !== agentId);
            setSelectedAgentId(remaining.length > 0 ? remaining[0].id : '');
          }
          loadData();
        } catch (e) {
          console.error(e);
        }
      };

      // Toggle plugin assigned to agent
      const handleTogglePluginForAgent = async (agentId, pluginId) => {
        try {
          await fetch(`/api/grok/agents/${agentId}/toggle-plugin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pluginId })
          });
          loadData();
        } catch (e) {
          console.error(e);
        }
      };

      // Toggle plugin installation
      const handleTogglePluginInstall = async (plugin) => {
        try {
          await fetch(`/api/grok/plugins/${plugin.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              installed: !plugin.installed,
              status: !plugin.installed ? 'connected' : 'disconnected'
            })
          });
          loadData();
        } catch (e) {
          console.error(e);
        }
      };

      const activeAgent = agents[selectedAgentId] || Object.values(agents)[0] || null;
      const agentList = Object.values(agents);

      return (
        <div className="flex-1 flex flex-col h-screen bg-[#080c14] text-slate-100 overflow-hidden">
          
          {/* ============================================================= */}
          {/* TOP APP BAR & MAIN NAVIGATION                                */}
          {/* ============================================================= */}
          <header className="h-14 bg-[#0d131f] border-b border-slate-800/80 px-6 flex justify-between items-center shrink-0 z-20">
            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-extrabold text-sm">
                  Ó
                </div>
                <div>
                  <h1 className="text-sm font-extrabold tracking-tight text-white flex items-center">
                    ÓPALO <span className="text-cyan-400 font-mono text-xs ml-1.5 font-bold">OS</span>
                  </h1>
                </div>
              </div>

              {/* Main View Switcher */}
              <nav className="flex space-x-1 bg-slate-900/90 border border-slate-800 p-1 rounded-xl">
                <button
                  onClick={() => setCurrentView('workspace')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-2 ${
                    currentView === 'workspace'
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <span>💬</span>
                  <span>Espacio de Trabajo</span>
                </button>

                <button
                  onClick={() => setCurrentView('organigram')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-2 ${
                    currentView === 'organigram'
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <span>🏢</span>
                  <span>Organigrama ({agentList.length})</span>
                </button>

                <button
                  onClick={() => setCurrentView('plugins')}
                  className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center space-x-2 ${
                    currentView === 'plugins'
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <span>🔌</span>
                  <span>Marketplace de Plugins</span>
                </button>
              </nav>
            </div>

            {/* Top Right Action: Conexión IA y Crear Agente */}
            <div className="flex items-center space-x-3">
              <button
                onClick={() => {
                  setAiTestMessage(null);
                  setShowAiModal(true);
                }}
                className={`flex items-center space-x-2 px-3 py-1.5 rounded-xl text-xs font-mono border transition-all ${
                  aiConfig.hasKey
                    ? 'bg-emerald-950/40 text-emerald-300 border-emerald-500/40 hover:bg-emerald-900/50'
                    : 'bg-amber-950/40 text-amber-300 border-amber-500/40 hover:bg-amber-900/50 animate-pulse'
                }`}
                title="Configurar conexión con Google Gemini AI"
              >
                <span className={`w-2 h-2 rounded-full ${aiConfig.hasKey ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                <span>{aiConfig.hasKey ? 'Gemini AI Conectado' : '⚡ Conectar Gemini Key'}</span>
                <span className="text-[10px] opacity-70">⚙️</span>
              </button>

              <button
                onClick={() => {
                  setNewAgentParentId('none');
                  setShowNewAgentModal(true);
                }}
                className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3.5 py-2 rounded-xl transition-all shadow-md shadow-indigo-600/20 flex items-center space-x-2 font-mono"
              >
                <span>+</span>
                <span>Crear Agente desde Cero</span>
              </button>

              <div className="h-6 w-px bg-slate-800"></div>

              <div className="flex items-center space-x-2">
                <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <span className="text-xs font-mono text-slate-400">{agentList.length} Activos</span>
              </div>
            </div>
          </header>

          {/* ============================================================= */}
          {/* VIEW 1: ESPACIO DE TRABAJO (WORKSPACE 3-PANEL VIEW)          */}
          {/* ============================================================= */}
          {currentView === 'workspace' && (
            <div className="flex-1 flex overflow-hidden">
              
              {/* SIDEBAR: DEPARTMENTS & AGENT LIST */}
              <aside className="w-80 bg-[#0d131f] border-r border-slate-800/80 flex flex-col shrink-0">
                {/* Department filter */}
                <div className="p-3 border-b border-slate-800/80">
                  <div className="flex justify-between items-center mb-2 px-1">
                    <span className="text-[10px] font-black uppercase text-slate-400 font-mono tracking-wider">DEPARTAMENTOS</span>
                  </div>
                  <div className="flex space-x-1.5 overflow-x-auto custom-scrollbar pb-1">
                    {channels.map(ch => (
                      <button
                        key={ch.id}
                        onClick={() => setSelectedChannel(ch.id)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all flex items-center space-x-1.5 ${
                          selectedChannel === ch.id
                            ? 'bg-indigo-600 text-white shadow'
                            : 'bg-slate-800/60 text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <span>{ch.icon}</span>
                        <span>{ch.name}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Agents List */}
                <div className="p-2 px-3 flex justify-between items-center">
                  <span className="text-[10px] font-black uppercase text-slate-500 font-mono">
                    AGENTES DE LA EMPRESA ({agentList.length})
                  </span>
                  <button
                    onClick={() => setCurrentView('organigram')}
                    className="text-[10px] text-cyan-400 font-mono hover:underline"
                  >
                    Ver Organigrama ➔
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto px-2 space-y-1.5 custom-scrollbar">
                  {agentList
                    .filter(a => selectedChannel === 'all' || a.channelId === selectedChannel)
                    .map(ag => (
                      <button
                        key={ag.id}
                        onClick={() => setSelectedAgentId(ag.id)}
                        className={`w-full text-left p-3 rounded-2xl transition-all flex items-center space-x-3 border ${
                          selectedAgentId === ag.id
                            ? 'bg-slate-800/90 border-indigo-500/70 text-white shadow-lg'
                            : 'bg-transparent border-transparent hover:bg-slate-850 hover:border-slate-800 text-slate-300'
                        }`}
                      >
                        <div className="relative">
                          <div className="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-xl shrink-0">
                            {ag.avatarEmoji || '🤖'}
                          </div>
                          <span className={`absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-[#0d131f] ${
                            ag.status === 'online' ? 'bg-emerald-500' : 'bg-amber-500'
                          }`} />
                        </div>

                        <div className="flex-1 min-w-0">
                          <div className="flex justify-between items-baseline">
                            <h4 className="text-xs font-bold truncate text-white">{ag.name}</h4>
                            <span className="text-[9px] font-mono text-cyan-400 bg-cyan-950/60 px-1.5 py-0.2 rounded border border-cyan-800/40">
                              {ag.department || 'General'}
                            </span>
                          </div>
                          <p className="text-[10px] text-slate-400 truncate mt-0.5">{ag.role}</p>
                          <div className="mt-1 flex items-center space-x-1 text-[9px] font-mono text-slate-500">
                            <span>↳ {ag.reportsTo ? `Reporta a: ${agents[ag.reportsTo]?.name || ag.reportsTo}` : 'Dirección'}</span>
                          </div>
                        </div>
                      </button>
                    ))}
                </div>
              </aside>

              {/* CENTER: ACTIVE AGENT CONVERSATION */}
              <main className="flex-1 flex flex-col bg-[#080c14] overflow-hidden border-r border-slate-800/80">
                {activeAgent ? (
                  <>
                    {/* Header */}
                    <div className="h-16 bg-[#0d131f] border-b border-slate-800/80 px-6 flex justify-between items-center shrink-0">
                      <div className="flex items-center space-x-3.5">
                        <div className="w-10 h-10 rounded-2xl bg-indigo-950/60 border border-indigo-500/40 flex items-center justify-center text-2xl">
                          {activeAgent.avatarEmoji || '🤖'}
                        </div>
                        <div>
                          <div className="flex items-center space-x-2">
                            <h2 className="text-sm font-extrabold text-white">{activeAgent.name}</h2>
                            <span className="text-[10px] font-mono bg-slate-800 text-cyan-400 px-2 py-0.5 rounded border border-slate-700">
                              {activeAgent.department}

                            {plugin.installed ? 'Conectado' : 'No Conectado'}
                          </span>
                        </div>

                        <div>
                          <h3 className="text-sm font-bold text-white">{plugin.name}</h3>
                          <span className="text-[10px] font-mono text-indigo-400">{plugin.category}</span>
                        </div>

                        <p className="text-[11px] text-slate-400 leading-relaxed">
                          {plugin.description}
                        </p>
                      </div>

                      <div className="pt-3 border-t border-slate-800/80 flex justify-between items-center text-xs">
                        <button
                          onClick={() => handleTogglePluginInstall(plugin)}
                          className={`px-3 py-1.5 rounded-xl font-mono text-xs font-bold transition-all ${
                            plugin.installed
                              ? 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                              : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow'
                          }`}
                        >
                          {plugin.installed ? 'Desconectar' : 'Conectar'}
                        </button>

                        <button
                          onClick={() => alert(`Configuración de ${plugin.name}: Las credenciales están encriptadas y sincronizadas.`)}
                          className="text-cyan-400 hover:text-cyan-300 font-mono text-xs"
                        >
                          Configurar ⚙️
                        </button>
                      </div>
                    </div>
                  ))}
                </div>

              </div>
            </div>
          )}

          {/* ============================================================= */}
          {/* MODAL: CREAR AGENTE DESDE CERO                                */}
          {/* ============================================================= */}
          {showNewAgentModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0e1422] border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-extrabold text-white flex items-center space-x-2">
                    <span>✨</span>
                    <span>Crear Agente desde Cero</span>
                  </h3>
                  <button onClick={() => setShowNewAgentModal(false)} className="text-slate-400 hover:text-white font-mono text-xs">✕</button>
                </div>

                <form onSubmit={handleCreateAgentSubmit} className="space-y-3.5 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] font-mono uppercase text-slate-400">Nombre del Agente</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej: Sofia Morales"
                        value={newAgentForm.name}
                        onChange={e => setNewAgentForm({ ...newAgentForm, name: e.target.value })}
                        className="w-full bg-[#121927] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-[10px] font-mono uppercase text-slate-400">Cargo / Rol</label>
                      <input
                        type="text"
                        required
                        placeholder="Ej: Copywriter Creativa"
                        value={newAgentForm.role}
                        onChange={e => setNewAgentForm({ ...newAgentForm, role: e.target.value })}
                        className="w-full bg-[#121927] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] font-mono uppercase text-slate-400">Departamento</label>
                      <select
                        value={newAgentForm.department}
                        onChange={e => {
                          const dep = e.target.value;
                          const chId = dep === 'Marketing & Crecimiento' ? 'marketing' : dep === 'Finanzas & Operaciones' ? 'finanzas' : 'direccion';
                          setNewAgentForm({ ...newAgentForm, department: dep, channelId: chId });
                        }}
                        className="w-full bg-[#121927] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none font-mono"
                      >
                        <option value="Dirección General">Dirección General</option>
                        <option value="Marketing & Crecimiento">Marketing & Crecimiento</option>
                        <option value="Finanzas & Operaciones">Finanzas & Operaciones</option>
                        <option value="Soporte & Clientes">Soporte & Clientes</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-[10px] font-mono uppercase text-slate-400">Reporta a (Organigrama)</label>
                      <select
                        value={newAgentForm.reportsTo}
                        onChange={e => setNewAgentForm({ ...newAgentForm, reportsTo: e.target.value })}
                        className="w-full bg-[#121927] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none font-mono"
                      >
                        <option value="none">Sin superior (Dirección Raíz)</option>
                        {agentList.map(a => (
                          <option key={a.id} value={a.id}>{a.name} ({a.role})</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] font-mono uppercase text-slate-400">Job Description / Misión del Agente</label>
                    <textarea
                      rows="3"
                      required
                      placeholder="Describe con precisión qué tareas ejecutará este agente, qué tono utilizará y cómo resolverá problemas..."
                      value={newAgentForm.jobDescription}
                      onChange={e => setNewAgentForm({ ...newAgentForm, jobDescription: e.target.value })}
                      className="w-full bg-[#121927] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none text-[11px] resize-none"
                    />
                  </div>

                  <div className="pt-2 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setShowNewAgentModal(false)}
                      className="px-4 py-2 rounded-xl text-slate-400 hover:text-white font-mono text-xs"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs font-mono shadow"
                    >
                      Incorporar al Organigrama
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CONFIGURACIÓN DE INTELIGENCIA ARTIFICIAL (GEMINI API KEY) */}
          {showAiModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0f172a] border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
                <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-800">
                  <div className="flex items-center space-x-2.5">
                    <span className="text-xl">✨</span>
                    <h3 className="text-sm font-bold text-white">Conexión con Inteligencia Artificial (Google Gemini)</h3>
                  </div>
                  <button
                    onClick={() => { setShowAiModal(false); setAiTestMessage(null); }}
                    className="text-slate-400 hover:text-white text-lg font-mono font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  <p className="text-slate-300 leading-relaxed">
                    Conecta tu API Key de Google Gemini para que todos los agentes razonen con autonomía, recuerden el contexto y generen organigramas dinámicamente.
                  </p>

                  <div className="p-3.5 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-indigo-200 text-[11px] space-y-1.5 leading-relaxed">
                    <div className="font-bold flex items-center space-x-1.5 text-indigo-300">
                      <span>🔑</span>
                      <span>¿Cómo obtener tu clave gratuita de Google?</span>
                    </div>
                    <div>
                      1. Entra a Google AI Studio:
                      <a
                        href="https://aistudio.google.com/app/apikey"
                        target="_blank"
                        rel="noreferrer"
                        className="text-cyan-400 underline font-mono ml-1 hover:text-cyan-300 font-bold"
                      >
                        aistudio.google.com/app/apikey ↗
                      </a>
                    </div>
                    <div>2. Haz clic en <strong>"Create API Key"</strong> y copia el código generado.</div>
                    <div className="text-[10px] text-amber-300/90 font-mono pt-1 border-t border-indigo-500/20">
                      ⚠️ Las claves válidas de Google AI Studio inician siempre con <strong>AIzaSy...</strong>
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] font-mono uppercase text-slate-400 block mb-1.5">
                      Estado actual: {aiConfig.hasKey ? (
                        <span className="text-emerald-400 font-mono font-bold">🟢 Conectado ({aiConfig.keyMasked})</span>
                      ) : (
                        <span className="text-amber-400 font-mono font-bold">🟡 Clave no configurada (usando motor inteligente de contingencia)</span>
                      )}
                    </label>
                    <input
                      type="password"
                      placeholder="Pega tu clave AIzaSy..."
                      value={aiKeyInput}
                      onChange={(e) => setAiKeyInput(e.target.value)}
                      className="w-full bg-[#121927] border border-slate-800 rounded-xl p-3 text-slate-100 font-mono text-xs focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  {aiTestMessage && (
                    <div className={`p-3 rounded-xl text-xs font-mono leading-relaxed ${
                      aiTestMessage.type === 'success'
                        ? 'bg-emerald-950/60 border border-emerald-500/40 text-emerald-300'
                        : 'bg-rose-950/60 border border-rose-500/40 text-rose-300'
                    }`}>
                      {aiTestMessage.text}
                    </div>
                  )}

                  <div className="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => { setShowAiModal(false); setAiTestMessage(null); }}
                      className="px-4 py-2 rounded-xl text-slate-400 hover:text-white font-mono text-xs"
                    >
                      Cerrar
                    </button>
                    <button
                      type="button"
                      onClick={handleSaveAiConfig}
                      disabled={aiTesting || !aiKeyInput.trim()}
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-500 text-white font-bold text-xs font-mono shadow flex items-center space-x-2"
                    >
                      {aiTesting ? (
                        <>
                          <span className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                          <span>Verificando con Gemini...</span>
                        </>
                      ) : (
                        <>
                          <span>🧪</span>
                          <span>Guardar y Probar Conexión</span>
                        </>
                      )}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
