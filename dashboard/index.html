<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darwin Ai - Portal de Clientes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f9fafb;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 99px;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex antialiased overflow-hidden">

  <div id="root" class="flex-1 flex overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState('chats');
      const [sessions, setSessions] = useState({});
      const [selectedSessionId, setSelectedSessionId] = useState('session-gabriel-scola');
      const [chatInput, setChatInput] = useState('');
      
      // AI Orchestration States (Grok-Style simulation inside active chat)
      const [salesforceStatus, setSalesforceStatus] = useState('action_needed'); // 'action_needed', 'signing_in', 'working', 'done'
      const [isAiPaused, setIsAiPaused] = useState(false);
      const [isTransferred, setIsTransferred] = useState(false);
      const [customLogs, setCustomLogs] = useState([]);
      const chatEndRef = useRef(null);

      // Seed Static Metrics mimicking Darwin AI
      const metrics = {
        leads: { total: 238, label: 'Clientes potenciales', detail: '+120 nuevos', change: 'up' },
        responseTime: { total: '10 minutos', label: 'Tiempo de respuestas', detail: '+1 min', change: 'up' },
        conversion: { total: '26%', label: 'Tasa de conversión', detail: '+5% s/m', change: 'up' }
      };

      useEffect(() => {
        loadSessions();
        initWebSockets();
      }, []);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [sessions, selectedSessionId, salesforceStatus, customLogs]);

      const loadSessions = async () => {
        try {
          const res = await fetch('/api/tenants');
          const data = await res.json();
          // We load the sessions from the central state machine via our API
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId: 'session-gabriel-scola', tenantId: 'mi-empresa', message: 'PING_MOCK' })
          });
          const chatData = await response.json();
          // Reload sessions listing
          const refreshRes = await fetch('/api/config?tenantId=mi-empresa');
          // In this case, we call the standard endpoints to fetch populated sessions
        } catch (err) {
          console.error('[Error loading sessions]:', err);
        }
      };

      const initWebSockets = () => {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);
        
        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.event === 'initial_state') {
            const initial = {};
            data.sessions.forEach(s => { initial[s.sessionId] = s; });
            setSessions(initial);
          } else if (data.event === 'session_created' || data.event === 'session_updated' || data.event === 'state_transition' || data.event === 'new_message') {
            // Re-fetch or update session lists dynamically
            setSessions(prev => ({
              ...prev,
              [data.session.sessionId]: {
                ...prev[data.session.sessionId],
                ...data.session
              }
            }));
          }
        };
      };

      // Handle user sending manual messages to the active client chat thread
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const text = chatInput;
        setChatInput('');

        // Append to local session state instantly
        const activeSess = sessions[selectedSessionId];
        if (!activeSess) return;

        const updatedHistory = [...(activeSess.history || []), { role: 'user', content: text, timestamp: new Date().toISOString() }];
        setSessions(prev => ({
          ...prev,
          [selectedSessionId]: {
            ...activeSess,
            history: updatedHistory
          }
        }));

        // If AI is paused, we simply add the message to history without firing robot answers
        if (isAiPaused) {
          setCustomLogs(prev => [...prev, `[Mesa de Control]: Chat atendido manualmente por operador humano (IA Pausada).`]);
          return;
        }

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: selectedSessionId,
              tenantId: 'mi-empresa',
              message: text
            })
          });
          const result = await response.json();
          if (result.success) {
            // Re-sync session state
            setSessions(prev => {
              const target = prev[selectedSessionId];
              return {
                ...prev,
                [selectedSessionId]: {
                  ...target,
                  history: [...(target.history || []), { role: 'assistant', content: result.reply, timestamp: new Date().toISOString() }]
                }
              };
            });

            // Trigger Grok Simulation transitions if relevant
            if (text.toLowerCase().includes('autos') || text.toLowerCase().includes('promociones')) {
              setSalesforceStatus('action_needed');
            }
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Mocking Grok's Salesforce integration workflow
      const handleSalesforceLogin = (e) => {
        e.preventDefault();
        setSalesforceStatus('signing_in');
        
        // Simulating sequence: signing_in -> working -> done
        setTimeout(() => {
          setSalesforceStatus('working');
          setTimeout(() => {
            setSalesforceStatus('done');
            setCustomLogs(prev => [
              ...prev,
              `[Sales Outbound Bot]: Sincronización exitosa. Registrado nuevo Lead en Salesforce CRM (ID: SF-70182).`,
              `[Chief of Staff]: Tarea de prospección completada de forma paralela en segundo plano.`
            ]);
          }, 3000);
        }, 2000);
      };

      const togglePauseAi = () => {
        setIsAiPaused(!isAiPaused);
        setCustomLogs(prev => [
          ...prev,
          `[Mesa de Control]: El estado del Agente ha sido cambiado a: ${!isAiPaused ? 'PAUSADO (Control Humano)' : 'ACTIVO (Orquestación Autónoma)'}.`
        ]);
      };

      const triggerTransfer = () => {
        setIsTransferred(true);
        setIsAiPaused(true);
        setCustomLogs(prev => [
          ...prev,
          `[Mesa de Control]: Transferido exitosamente a bandeja de operador humano. IA pausada para evitar colisiones.`
        ]);
        alert("¡Transferido! El agente autónomo se ha pausado y ahora puedes responder directamente al cliente.");
      };

      const getActiveSessionMessages = () => {
        const activeSess = sessions[selectedSessionId];
        if (!activeSess) return [];
        
        // Let's return local list of messages
        // Since we seed them locally in the stateMachine on start, we display them here
        return activeSess.history || [];
      };

      const activeSession = sessions[selectedSessionId] || { name: 'Gabriel Scola', phase: 'Prospect', email: 'gabriel.scola@gmail.com' };

      return (
        <div className="flex-1 flex overflow-hidden h-screen bg-white">
          
          {/* LEFT SIDEBAR (DARWIN AI BRANDED SIDEBAR) */}
          <aside className="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0">
            <div className="flex flex-col">
              
              {/* Brand Header */}
              <div className="p-6 flex items-center space-x-2 border-b border-slate-100">
                <span className="text-2xl font-black text-slate-900 tracking-tight flex items-center">
                  Darwin <span className="text-blue-600 ml-1">Ai</span>
                </span>
                <span className="w-2 h-2 rounded-full bg-blue-600 animate-pulse mt-3"></span>
              </div>

              {/* Main Menu Links */}
              <nav className="p-4 space-y-1">
                <button onClick={() => setCurrentTab('chats')} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${currentTab === 'chats' ? 'bg-blue-50/60 text-blue-600' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}`}>
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                  <span>Chats</span>
                </button>

                <button onClick={() => alert("Módulo Contactos premium - Próximamente")} className="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 hover:bg-slate-50 transition-all">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                  <span>Contactos</span>
                </button>

                <button onClick={() => alert("Panel de Campañas automatizadas - Próximamente")} className="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 hover:bg-slate-50 transition-all">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" /></svg>
                  <span>Campañas</span>
                </button>

                <button onClick={() => alert("Sección de Métricas Avanzadas - Próximamente")} className="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-800 hover:bg-slate-50 transition-all">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" /></svg>
                  <span>Métricas</span>
                </button>
              </nav>

              {/* TEAMS SECTION (GROK-STYLE AI EMPLOYEES LIST) */}
              <div className="px-6 py-4">
                <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider">IA EMPLOYEES</span>
                <div className="mt-3 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2.5">
                      <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                      <span className="text-xs font-semibold text-slate-700">Chief of Staff</span>
                    </div>
                    <span className="text-[8px] font-bold bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded uppercase">Active</span>
                  </div>

                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2.5">
                      <span className="w-2 h-2 rounded-full bg-[#818cf8]"></span>
                      <span className="text-xs font-semibold text-slate-700">Sales Outbound</span>
                    </div>
                    <span className="text-[8px] font-bold bg-indigo-50 text-[#818cf8] px-1.5 py-0.5 rounded uppercase">Working</span>
                  </div>

                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2.5">
                      <span className="w-2 h-2 rounded-full bg-slate-300"></span>
                      <span className="text-xs font-semibold text-slate-500">Talent & Onboarding</span>
                    </div>
                    <span className="text-[8px] font-bold bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded uppercase">Idle</span>
                  </div>

                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2.5">
                      <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                      <span className="text-xs font-semibold text-slate-700">Ops Manager</span>
                    </div>
                    <span className="text-[8px] font-bold bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded uppercase">Online</span>
                  </div>
                </div>
              </div>

            </div>

            {/* User Profile Card (Lautaro) */}
            <div className="p-4 border-t border-slate-100 bg-slate-50/50 flex items-center space-x-3">
              <div className="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-black text-sm">
                L
              </div>
              <div>
                <h4 className="text-xs font-bold text-slate-800 leading-none">Lautaro</h4>
                <p className="text-[10px] font-semibold text-slate-500 mt-1">Dueño de Cuenta</p>
              </div>
            </div>
          </aside>

          {/* MAIN CRM CONTENT CONTAINER (DARWIN MAIN GRID) */}
          <main className="flex-1 flex flex-col min-w-0 bg-[#f9fafb]">
            
            {/* Header / Metrics row (Darwin Branded Style) */}
            <header className="p-6 bg-white border-b border-slate-200">
              <div className="flex justify-between items-start mb-6">
                <div>
                  <h1 className="text-2xl font-extrabold text-slate-900">Bienvenido, Lautaro</h1>
                  <p className="text-xs text-slate-500 font-medium mt-0.5">Darwin ha manejado estos chats. Revisa las interacciones y optimiza la atención al cliente.</p>
                </div>
                <div className="flex items-center space-x-2 bg-slate-50 border border-slate-200 px-3.5 py-1.5 rounded-xl text-xs font-bold text-slate-600">
                  <svg className="w-4 h-4 text-slate-400 mr-1.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                  <span>17 Sep, 2026</span>
                </div>
              </div>

              {/* Top Stats Cards */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {Object.keys(metrics).map(key => (
                  <div key={key} className="bg-[#f9fafb] border border-slate-200 rounded-2xl p-4 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] font-bold uppercase text-slate-400 tracking-wider">{metrics[key].label}</span>
                      <h2 className="text-xl font-extrabold text-slate-800 mt-1">{metrics[key].total}</h2>
                    </div>
                    <div className="text-right">
                      <span className="text-[10px] font-black bg-emerald-50 text-emerald-600 px-2.5 py-1 rounded-full">{metrics[key].detail}</span>
                    </div>
                  </div>
                ))}
              </div>
            </header>

            {/* Split Screen Panel: Chat Lists (Center) & Chat Conversation (Right) */}
            <div className="flex-1 flex overflow-hidden">
              
              {/* CHATS LIST (COLUMNA CENTRAL) */}
              <div className="w-96 border-r border-slate-200 bg-white flex flex-col shrink-0">
                <div className="p-4 border-b border-slate-100">
                  <div className="relative">
                    <input type="text" placeholder="Buscar por nombre, correo..." className="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pl-9 pr-4 text-xs font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-all" />
                    <svg className="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto divide-y divide-slate-100 custom-scrollbar">
                  {Object.values(sessions).map(s => (
                    <button key={s.sessionId} onClick={() => setSelectedSessionId(s.sessionId)} className={`w-full text-left p-4 flex items-start space-x-3 transition-all focus:outline-none ${selectedSessionId === s.sessionId ? 'bg-blue-50/40' : 'hover:bg-slate-50/50'}`}>
                      <div className="w-10 h-10 rounded-full bg-slate-100 border border-slate-200 text-slate-600 font-extrabold text-xs flex items-center justify-center shrink-0 uppercase">
                        {s.name ? s.name.substring(0, 2) : 'AN'}
                      </div>
                      
                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-baseline">
                          <h4 className={`text-xs font-bold truncate ${selectedSessionId === s.sessionId ? 'text-blue-700' : 'text-slate-800'}`}>{s.name || 'Sesión Activa'}</h4>
                          <span className="text-[9px] text-slate-400 font-medium">Hace 2m</span>
                        </div>
                        <p className="text-[10px] text-slate-500 truncate font-semibold mt-0.5">{s.email || 'sin-correo@crm.com'}</p>
                        
                        <div className="flex items-center space-x-2 mt-2">
                          <span className={`text-[8px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full ${s.phase === 'New Customer' ? 'bg-indigo-50 text-[#818cf8]' : (s.phase === 'Active Customer' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600')}`}>
                            {s.phase === 'New Customer' ? 'Onboarding' : (s.phase === 'Active Customer' ? 'Mesa de Control' : 'Ventas')}
                          </span>
                        </div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              {/* CONVERSACIÓN ACTIVA Y GROK LOGS (COLUMNA DERECHA) */}
              <div className="flex-1 flex flex-col bg-white overflow-hidden">
                
                {/* Active Chat Header */}
                <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-white">
                  <div className="flex items-center space-x-3">
                    <div className="w-9 h-9 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs uppercase">
                      {activeSession.name.substring(0, 2)}
                    </div>
                    <div>
                      <h3 className="text-xs font-extrabold text-slate-800 leading-none">{activeSession.name}</h3>
                      <span className="text-[10px] text-slate-400 font-bold mt-1.5 block">{activeSession.email}</span>
                    </div>
                  </div>

                  <div className="flex items-center space-x-2">
                    <span className="text-[10px] font-black uppercase tracking-widest text-[#a2a0a8]">ESTADO IA:</span>
                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-xl uppercase flex items-center space-x-1.5 ${isAiPaused ? 'bg-amber-50 text-amber-600' : 'bg-emerald-50 text-emerald-600'}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${isAiPaused ? 'bg-amber-500' : 'bg-emerald-500 animate-pulse'}`}></span>
                      <span>{isAiPaused ? 'PAUSADO (Manual)' : 'ACTIVO (Orquestación)'}</span>
                    </span>
                  </div>
                </div>

                {/* Chat Message Thread */}
                <div className="flex-1 overflow-y-auto p-6 bg-slate-50/50 space-y-4 custom-scrollbar">
                  {getActiveSessionMessages().map((msg, i) => (
                    <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`p-3.5 rounded-2xl text-xs max-w-[80%] leading-relaxed shadow-sm border ${msg.role === 'user' ? 'bg-blue-600 text-white border-blue-500 rounded-tr-none' : 'bg-white text-slate-800 border-slate-100 rounded-tl-none'}`}>
                        {msg.content}
                      </div>
                    </div>
                  ))}

                  {/* GROK-STYLE TEAMMATES BACK-CHANNEL (AI COLLAB BOX) */}
                  <div className="bg-white border border-slate-200 rounded-2xl p-5 space-y-4 max-w-[90%] mx-auto shadow-md">
                    
                    {/* Header */}
                    <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                      <div className="flex items-center space-x-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
                        <span className="text-[10px] font-black text-slate-800 uppercase tracking-widest">Teammates Back-Channel</span>
                      </div>
                      <span className="text-[9px] font-bold text-indigo-500 uppercase tracking-wider bg-indigo-50 px-2 py-0.5 rounded-full">Parallel Sync</span>
                    </div>

                    {/* Simulation Flow of Salesforce connection */}
                    <div className="space-y-3">
                      <div className="flex items-start space-x-3 text-xs">
                        <span className="text-slate-400 shrink-0 font-bold font-mono">💻 Computer</span>
                        
                        <div className="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-4">
                          {salesforceStatus === 'action_needed' && (
                            <div className="space-y-3">
                              <div className="flex justify-between items-center">
                                <span className="font-extrabold text-xs text-slate-800">Sign in to Salesforce</span>
                                <span className="text-[9px] font-black uppercase text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">Action Needed</span>
                              </div>
                              <p className="text-slate-500 text-[11px] leading-relaxed">Conéctate a tu Salesforce para que el Sales Outbound Bot pueda validar, cotizar y sincronizar el lead comercial de este cliente.</p>
                              
                              <form onSubmit={handleSalesforceLogin} className="space-y-2 pt-1">
                                <input type="email" required placeholder="tu-correo@empresa.com" defaultValue="lautaro@eirs.ai" className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none" />
                                <input type="password" required placeholder="••••••••" defaultValue="contrasenia123" className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none" />
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 rounded-lg transition-all shadow">Conectar Salesforce</button>
                              </form>
                            </div>
                          )}

                          {salesforceStatus === 'signing_in' && (
                            <div className="flex items-center space-x-3 py-3">
                              <span className="w-4 h-4 rounded-full border-2 border-slate-300 border-t-blue-600 animate-spin"></span>
                              <span className="text-xs font-bold text-slate-600">Verificando credenciales de Salesforce...</span>
                            </div>
                          )}

                          {salesforceStatus === 'working' && (
                            <div className="space-y-2 py-1">
                              <div className="flex items-center space-x-2">
                                <span className="w-3.5 h-3.5 rounded-full border-2 border-slate-300 border-t-indigo-600 animate-spin"></span>
                                <span className="text-xs font-extrabold text-indigo-600">Working...</span>
                              </div>
                              <p className="text-slate-500 text-[10px] font-semibold">El bot especialista está analizando el catálogo de fletes y generando el perfil comercial en tu CRM.</p>
                            </div>
                          )}

                          {salesforceStatus === 'done' && (
                            <div className="space-y-2.5 text-xs">
                              <div className="flex justify-between items-center pb-1 border-b border-slate-100">
                                <span className="font-extrabold text-slate-800">Conexión de Salesforce</span>
                                <span className="text-[9px] font-black uppercase text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full">● Done</span>
                              </div>
                              <div className="space-y-1 font-mono text-[10px] text-slate-600 leading-relaxed">
                                <p className="text-emerald-600 font-bold">✓ Salesforce - lead synced: SF-70182-Gabriel</p>
                                <p>✓ Hex - 3 lookalike logistics segments analyzed</p>
                                <p>✓ LinkedIn - 4 matching corporate profiles skipped</p>
                                <p>✓ Sequencer - 36 automated marketing drafts queued</p>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Custom Telemetry Log Feed inside the Back-Channel */}
                      <div className="space-y-1.5 pl-3 border-l-2 border-slate-100 pt-1 text-[11px] font-semibold leading-relaxed font-mono text-slate-500">
                        {customLogs.length === 0 ? (
                          <div className="text-slate-400 italic">Esperando que el bot asigne tareas en paralelo...</div>
                        ) : (
                          customLogs.map((log, i) => (
                            <div key={i} className="pb-1 border-b border-slate-100/50 last:border-0 last:pb-0">{log}</div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>

                  <div ref={chatEndRef} />
                </div>

                {/* Bottom Bar: Action buttons and Message Input Form */}
                <div className="p-4 border-t border-slate-200 bg-white">
                  
                  {/* Dynamic Action Buttons (Darwin-Style rounded outline controls) */}
                  <div className="flex space-x-3 mb-4">
                    <button onClick={triggerTransfer} className={`flex-1 flex items-center justify-center space-x-2 py-2.5 rounded-full border text-xs font-bold transition-all ${isTransferred ? 'bg-slate-50 border-slate-200 text-slate-400' : 'bg-white hover:bg-slate-50 border-blue-600 text-blue-600'}`}>
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
                      <span>{isTransferred ? 'Transferido' : 'Transferir a Humano'}</span>
                    </button>

                    <button onClick={togglePauseAi} className={`flex-1 flex items-center justify-center space-x-2 py-2.5 rounded-full border text-xs font-bold transition-all ${isAiPaused ? 'bg-emerald-600 text-white border-emerald-500 hover:bg-emerald-700' : 'bg-white hover:bg-slate-50 border-amber-500 text-amber-500'}`}>
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      <span>{isAiPaused ? 'Reanudar IA' : 'Pausar IA'}</span>
                    </button>
                  </div>

                  {/* Manual Message Input Box */}
                  <form onSubmit={handleSendMessage} className="flex items-center space-x-3 bg-slate-50 border border-slate-200 p-2 rounded-2xl focus-within:border-blue-500 focus-within:bg-white transition-all">
                    <input type="text" value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder={isAiPaused ? "IA Pausada. Escribe para contestarle al cliente..." : "Pregúntale a la IA o escribe directamente..."} className="flex-1 bg-transparent text-xs text-slate-800 p-2 focus:outline-none" />
                    <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white rounded-xl p-2 px-4 text-xs font-bold shrink-0 shadow transition-all">
                      Enviar
                    </button>
                  </form>

                </div>

              </div>

            </div>

          </main>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
