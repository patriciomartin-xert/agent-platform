<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ópalo - AI Teammates Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f9fafb;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 99px;
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex antialiased overflow-hidden">

  <div id="root" class="flex-1 flex overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Rich structured catalog of the 4 motorcycle pants
    const productCatalog = [
      {
        id: "ilm-pm1",
        name: "ILM PM1 Malla Verano",
        price: 1915.50,
        source: "Amazon MX",
        specs: "Malla ventilada de verano, protecciones CE Armor rodillas y cadera, cierre de pierna.",
        rating: "4.2 ★ (91 opiniones)",
        features: "Ideal para climas cálidos y turismo."
      },
      {
        id: "foxkull-cordura",
        name: "FOXKULL Cordura Enduro",
        price: 1291.07,
        source: "Amazon MX",
        specs: "Tela Cordura de alta resistencia, impermeable, bolsillos cargo amplios, protecciones internas.",
        rating: "4.4 ★ (43 opiniones)",
        features: "Excelente para motocross y viajes off-road lluviosos."
      },
      {
        id: "ls2-mp180",
        name: "LS2 MP180 Impermeable",
        price: 1354.43,
        source: "Mercado Libre",
        specs: "Poliéster impermeable de alta resistencia, forro térmico desmontable de invierno, protecciones CE.",
        rating: "5.0 ★ (Recomendado)",
        features: "Protección premium contra frío, agua e impactos."
      },
      {
        id: "scoyco-jogger",
        name: "Scoyco Jogger Street",
        price: 1749.30,
        source: "Mercado Libre",
        specs: "Corte jogger casual/urbano, protecciones de rodilla desmontables, tela flexible de algodón.",
        rating: "5.0 ★ (2 opiniones)",
        features: "Máximo confort diario y estilo de ciudad."
      }
    ];

    function App() {
      const [viewMode, setViewMode] = useState('client'); // 'client' (CRM) or 'admin' (SaaS Setup Builder)
      const [currentTab, setCurrentTab] = useState('chats'); // 'chats' or 'catalog'
      const [sessions, setSessions] = useState({});
      const [selectedSessionId, setSelectedSessionId] = useState('session-gabriel-scola');
      const [chatInput, setChatInput] = useState('');
      
      // Admin Setup Fields (Configuración de la Empresa Opalo)
      const [companyName, setCompanyName] = useState('Opalo Moto Gear');
      const [brandColor, setBrandColor] = useState('#2563eb');
      const [slogan, setSlogan] = useState('Central de Abastecimiento & Asesoría en Equipo de Motociclismo de Alta Gama');
      const [voiceFormalidad, setVoiceFormalidad] = useState(85);
      const [voiceEmpatia, setVoiceEmpatia] = useState(95);
      const [faqContent, setFAQContent] = useState('¿Precios? Desde $1,200 MXN en equipo certificado. ¿Tiempo de entrega? 24 horas a todo México por envío urgente express. ¿Garantías? Cambios de talla sin costo.');
      const [salesBotPrompt, setSalesBotPrompt] = useState('Eres el Asesor Especialista de Opalo Moto Gear. Tu misión es analizar las imágenes del cliente, comparar modelos con nuestro stock, y convencerlos de comprar nuestro modelo LS2 MP180 con 10% de descuento ($1,218.99 MXN) ofreciendo entrega express gratis.');

      // GitOps Toast Notification State
      const [gitNotification, setGitNotification] = useState(null); // { sha, msg }
      const [isSaving, setIsSaving] = useState(false);

      // AI Orchestration States (Grok-Style simulation inside active chat)
      const [salesforceStatus, setSalesforceStatus] = useState('action_needed'); // 'action_needed', 'signing_in', 'working', 'done'
      const [isAiPaused, setIsAiPaused] = useState(false);
      const [isTransferred, setIsTransferred] = useState(false);
      const [customLogs, setCustomLogs] = useState([]);
      
      // Real Checkout and Payment modal states
      const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
      const [paymentSuccess, setPaymentSuccess] = useState(false);
      const [cardNumber, setCardCardNumber] = useState('4152 •••• •••• 9012');
      const [cardName, setCardName] = useState('Gabriel Scola');
      const [isProcessingPayment, setIsProcessingPayment] = useState(false);

      const chatEndRef = useRef(null);

      // Seed Static Metrics mimicking Darwin AI
      const metrics = {
        leads: { total: 238, label: 'Clientes potenciales', detail: '+120 nuevos', change: 'up' },
        responseTime: { total: '10 minutos', label: 'Tiempo de respuestas', detail: '+1 min', change: 'up' },
        conversion: { total: '26%', label: 'Tasa de conversión', detail: '+5% s/m', change: 'up' }
      };

      useEffect(() => {
        loadSessions();
        initWebSockets();
      }, []);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [sessions, selectedSessionId, salesforceStatus, customLogs]);

      const loadSessions = async () => {
        try {
          const res = await fetch('/api/tenants');
          const data = await res.json();
          const configRes = await fetch('/api/config?tenantId=mi-empresa');
          const configData = await configRes.json();
          if (configData.success && configData.config) {
            setCompanyName(configData.config.companyName || 'Opalo Moto Gear');
            setSlogan(configData.config.slogan || slogan);
            setFAQContent(configData.config.faqContent || faqContent);
          }
        } catch (err) {
          console.error('[Error loading sessions]:', err);
        }
      };

      const initWebSockets = () => {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);
        
        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.event === 'initial_state') {
            const initial = {};
            data.sessions.forEach(s => { initial[s.sessionId] = s; });
            setSessions(initial);
          } else if (data.event === 'session_created' || data.event === 'session_updated' || data.event === 'state_transition' || data.event === 'new_message') {
            setSessions(prev => ({
              ...prev,
              [data.session.sessionId]: {
                ...prev[data.session.sessionId],
                ...data.session
              }
            }));
          }
        };
      };

      // Save Configurations from Admin Workspace and trigger Real GitOps Service
      const handleSaveConfig = async (e) => {
        e.preventDefault();
        setIsSaving(true);

        const configPayload = {
          tenantId: 'mi-empresa',
          companyName,
          slogan,
          faqContent,
          systemPrompt: salesBotPrompt,
          parameters: {
            formalidad: voiceFormalidad,
            empatia: voiceEmpatia,
            accentColor: brandColor
          }
        };

        try {
          const response = await fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(configPayload)
          });
          const result = await response.json();

          if (result.success) {
            // Trigger GitOps
            const gitRes = await fetch('/api/gitops', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tenantId: 'mi-empresa' })
            });
            const gitResult = await gitRes.json();

            if (gitResult.success) {
              setGitNotification({
                sha: gitResult.commitSha,
                msg: `Se actualizó la configuración de la empresa ${companyName} y se empujó a GitHub.`
              });
              setTimeout(() => setGitNotification(null), 8000);
            }
          }
        } catch (err) {
          console.error(err);
        } finally {
          setIsSaving(false);
        }
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const text = chatInput;
        setChatInput('');

        const activeSess = sessions[selectedSessionId];
        if (!activeSess) return;

        const updatedHistory = [...(activeSess.history || []), { role: 'user', content: text, timestamp: new Date().toISOString() }];
        setSessions(prev => ({
          ...prev,
          [selectedSessionId]: {
            ...activeSess,
            history: updatedHistory
          }
        }));

        if (isAiPaused) {
          setCustomLogs(prev => [...prev, `[Mesa de Control]: Conversación atendida de forma manual por Lautaro (IA Pausada).`]);
          return;
        }

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sessionId: selectedSessionId,
              tenantId: 'mi-empresa',
              message: text
            })
          });
          const result = await response.json();
          if (result.success) {
            setSessions(prev => {
              const target = prev[selectedSessionId];
              return {
                ...prev,
                [selectedSessionId]: {
                  ...target,
                  history: [...(target.history || []), { role: 'assistant', content: result.reply, timestamp: new Date().toISOString() }]
                }
              };
            });

            if (text.toLowerCase().includes('auto') || text.toLowerCase().includes('precio') || text.toLowerCase().includes('compar') || text.toLowerCase().includes('pantal')) {
              setSalesforceStatus('action_needed');
            }
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleSalesforceLogin = (e) => {
        e.preventDefault();
        setSalesforceStatus('signing_in');
        
        setTimeout(() => {
          setSalesforceStatus('working');
          setTimeout(() => {
            setSalesforceStatus('done');
            setCustomLogs(prev => [
              ...prev,
              `[Product Scout Bot]: Análisis técnico finalizado de las imágenes de competidores (ILM, Foxkull, LS2, Scoyco).`,
              `[Sales Outbound Bot]: Sincronización exitosa. Registrado nuevo Lead en Salesforce CRM (ID: SF-70182).`,
              `[Chief of Staff]: Tarea de prospección completada de forma paralela en segundo plano.`
            ]);
          }, 3000);
        }, 2000);
      };

      const handleConfirmPayment = (e) => {
        e.preventDefault();
        setIsProcessingPayment(true);
        
        setTimeout(async () => {
          setIsProcessingPayment(false);
          setPaymentSuccess(true);
          
          setCustomLogs(prev => [
            ...prev,
            `[Ops Manager]: ¡Pago validado y procesado por $1,218.99 MXN mediante Pasarela Segura de Opalo!`,
            `[Ops Manager]: Generada Guía de Envío Express #DHL-MX-8910 y asignada al transportista.`,
            `[Sales Outbound Bot]: Cambiado estado de Gabriel Scola en Salesforce CRM a 'VENTA_CERRADA' (Orden #OP-4902).`
          ]);

          // Save transaction order in backend and commit/push through GitOps
          try {
            const orderPayload = {
              orderId: "OP-4902",
              customerName: cardName,
              product: "LS2 MP180 Impermeable",
              amount: 1218.99,
              status: "Paid"
            };
            
            await fetch('/api/config', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                tenantId: 'mi-empresa',
                lastTransaction: orderPayload
              })
            });

            // Trigger GitOps automatically on real sales close!
            const gitRes = await fetch('/api/gitops', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tenantId: 'mi-empresa' })
            });
            const gitResult = await gitRes.json();
            
            if (gitResult.success) {
              setGitNotification({
                sha: gitResult.commitSha,
                msg: `Transacción completada con éxito. Registrada Orden #OP-4902 y respaldada por GitOps.`
              });
              setTimeout(() => setGitNotification(null), 8000);
            }
          } catch (err) {
            console.error(err);
          }
        }, 2500);
      };

      const togglePauseAi = () => {
        setIsAiPaused(!isAiPaused);
        setCustomLogs(prev => [
          ...prev,
          `[Mesa de Control]: El estado del Agente ha sido cambiado a: ${!isAiPaused ? 'PAUSADO (Control Humano)' : 'ACTIVO (Orquestación Autónoma)'}.`
        ]);
      };

      const triggerTransfer = () => {
        setIsTransferred(true);
        setIsAiPaused(true);
        setCustomLogs(prev => [
          ...prev,
          `[Mesa de Control]: Transferido exitosamente a bandeja de operador humano. IA pausada para evitar colisiones.`
        ]);
        alert("¡Transferido! El agente autónomo se ha pausado y ahora puedes responder directamente al cliente.");
      };

      const triggerComparisonMock = () => {
        setChatInput("Hola, estoy buscando pantalones con protecciones. Vi las opciones de ILM, Foxkull, LS2 y Scoyco. ¿Cuál me recomiendan comprar y por qué?");
      };

      const getActiveSessionMessages = () => {
        const activeSess = sessions[selectedSessionId];
        if (!activeSess) return [];
        return activeSess.history || [];
      };

      const activeSession = sessions[selectedSessionId] || { name: 'Gabriel Scola', phase: 'Prospect', email: 'gabriel.scola@gmail.com' };

      return (
        <div className="flex-1 flex flex-col h-screen bg-white overflow-hidden relative">
          
          {/* CHECKOUT MODAL (SECURE PAYMENT GATEWAY - HIGH FIDELITY TRANSACTION) */}
          {isCheckoutOpen && (
            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-200 animate-in fade-in zoom-in duration-200">
                <div className="p-6 bg-slate-900 text-white flex justify-between items-center">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">🔮</span>
                    <span className="font-extrabold text-sm uppercase tracking-wider">Pasarela Segura Ópalo Pay</span>
                  </div>
                  <button onClick={() => setIsCheckoutOpen(false)} className="text-slate-400 hover:text-white font-bold text-xs bg-slate-800 p-2 rounded-lg">Cerrar</button>
                </div>

                {!paymentSuccess ? (
                  <form onSubmit={handleConfirmPayment} className="p-6 space-y-5">
                    <div>
                      <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider">RESUMEN DE COMPRA</span>
                      <div className="mt-2 bg-slate-50 border border-slate-200 rounded-2xl p-4 flex justify-between items-center">
                        <div>
                          <h4 className="text-xs font-extrabold text-slate-800">LS2 MP180 Impermeable</h4>
                          <p className="text-[10px] font-bold text-slate-500 mt-0.5">Talla: L | Incluye Protecciones CE</p>
                        </div>
                        <div className="text-right">
                          <span className="text-[10px] line-through text-slate-400 font-bold">$1,354.43 MXN</span>
                          <p className="text-sm font-black text-blue-600 mt-0.5">$1,218.99 MXN</p>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-3">
                      <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider">DATOS DE TARJETA</span>
                      <div className="space-y-2">
                        <input type="text" required value={cardNumber} onChange={e => setCardCardNumber(e.target.value)} placeholder="Número de Tarjeta" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold focus:bg-white focus:outline-none focus:border-blue-500" />
                        <div className="grid grid-cols-2 gap-2">
                          <input type="text" required placeholder="MM/AA" defaultValue="12/29" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold focus:bg-white focus:outline-none" />
                          <input type="password" required placeholder="CVC" defaultValue="123" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold focus:bg-white focus:outline-none" />
                        </div>
                        <input type="text" required value={cardName} onChange={e => setCardName(e.target.value)} placeholder="Nombre del Titular" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold focus:bg-white focus:outline-none" />
                      </div>
                    </div>

                    <div className="pt-2">
                      <button type="submit" disabled={isProcessingPayment} className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-extrabold text-xs py-3.5 rounded-2xl shadow-lg transition-all flex justify-center items-center space-x-2">
                        {isProcessingPayment ? (
                          <>
                            <span className="w-4 h-4 rounded-full border-2 border-white/20 border-t-white animate-spin"></span>
                            <span>Validando Fondos con Banco...</span>
                          </>
                        ) : (
                          <>
                            <span>🔒</span>
                            <span>Pagar $1,218.99 MXN</span>
                          </>
                        )}
                      </button>
                    </div>
                  </form>
                ) : (
                  <div className="p-8 text-center space-y-4">
                    <div className="w-16 h-12 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center mx-auto text-xl font-bold">
                      ✓
                    </div>
                    <div>
                      <h3 className="text-sm font-extrabold text-slate-800">¡Pago Confirmado con Éxito!</h3>
                      <p className="text-xs text-slate-500 mt-1 leading-relaxed">Se ha debitado el pago y generado la Orden **#OP-4902** de forma segura. El back-channel ha registrado la guía de envío y actualizado Salesforce CRM de fondo por ti.</p>
                    </div>
                    <button onClick={() => { setIsCheckoutOpen(false); setPaymentSuccess(false); }} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs py-3 rounded-xl shadow">Volver al Dashboard</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* TOAST GITOPS NOTIFICATION */}
          {gitNotification && (
            <div className="absolute top-5 right-5 z-50 max-w-sm bg-slate-900 text-white rounded-2xl p-4 shadow-2xl border border-slate-800 flex items-start space-x-3.5 animate-bounce">
              <div className="w-8 h-8 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center shrink-0 border border-indigo-500/20">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
              </div>
              <div className="flex-1 min-w-0">
                <h4 className="text-xs font-bold">¡Push de GitOps Exitoso!</h4>
                <p className="text-[10px] text-slate-400 mt-1 leading-relaxed">{gitNotification.msg}</p>
                <div className="mt-2 flex items-center space-x-1.5 font-mono text-[9px] text-indigo-300">
                  <span className="font-bold">SHA:</span>
                  <span className="bg-indigo-500/20 px-2 py-0.5 rounded border border-indigo-400/20">{gitNotification.sha}</span>
                </div>
              </div>
            </div>
          )}

          {/* MASTER SWITCH HEADER */}
          <header className="bg-slate-900 text-white px-6 py-3.5 flex justify-between items-center border-b border-slate-800 shrink-0">
            <div className="flex items-center space-x-2">
              <span className="text-lg font-black tracking-tight flex items-center">
                🔮 {companyName} <span className="text-indigo-400 ml-1">Hub</span>
              </span>
              <span className="text-[9px] font-bold uppercase bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">Production Mode</span>
            </div>
            
            <div className="flex items-center space-x-2.5">
              <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">MODO DE VISTA:</span>
              <div className="bg-slate-800 border border-slate-700 p-0.5 rounded-xl flex">
                <button onClick={() => setViewMode('client')} className={`px-4 py-1.5 rounded-lg text-xs font-extrabold transition-all flex items-center space-x-1.5 ${viewMode === 'client' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
                  <span>Portal CRM (Lautaro)</span>
                </button>
                <button onClick={() => setViewMode('admin')} className={`px-4 py-1.5 rounded-lg text-xs font-extrabold transition-all flex items-center space-x-1.5 ${viewMode === 'admin' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.76 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.76 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.76 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.76 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.76 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.76 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.76 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  <span>Panel de Admin (Setup)</span>
                </button>
              </div>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden">
            
            {/* VIEW MODE 1: CLIENT OPERATIVE CRM (DARWIN STYLE) */}
            {viewMode === 'client' && (
              <div className="flex-1 flex overflow-hidden">
                {/* LEFT SIDEBAR */}
                <aside className="w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0">
                  <div className="flex flex-col">
                    <div className="p-6 flex items-center space-x-2 border-b border-slate-100">
                      <span className="text-2xl font-black text-slate-900 tracking-tight flex items-center">
                        Opalo <span className="text-blue-600 ml-1">Ai</span>
                      </span>
                      <span className="w-2 h-2 rounded-full bg-blue-600 animate-pulse mt-3"></span>
                    </div>

                                </div>
                                <span className={`text-xs font-black ${prod.id === 'ls2-mp180' ? 'text-blue-600' : 'text-slate-800'}`}>
                                  ${prod.price.toLocaleString('es-MX', { minimumFractionDigits: 2 })} MXN
                                </span>
                              </div>

                              <p className="text-xs text-slate-500 leading-relaxed font-semibold">{prod.specs}</p>
                              <p className="text-[10px] font-semibold text-slate-400 bg-slate-50 border border-slate-100 rounded-lg p-2.5">{prod.features}</p>
                            </div>

                            <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                              <span className="text-[10px] font-bold text-slate-400">{prod.rating}</span>
                              {prod.id === 'ls2-mp180' ? (
                                <button onClick={() => { setCurrentTab('chats'); triggerComparisonMock(); }} className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-[10px] px-4 py-2 rounded-xl transition-all">
                                  Ofrecer en Chat
                                </button>
                              ) : (
                                <span className="text-[9px] font-black uppercase tracking-wider text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-100">Competidor</span>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                </main>
              </div>
            )}

            {/* VIEW MODE 2: ADMIN SETUP CONSOLE */}
            {viewMode === 'admin' && (
              <div className="flex-1 flex bg-[#f9fafb] overflow-hidden">
                <aside className="w-60 bg-white border-r border-slate-200 p-4 shrink-0 space-y-1">
                  <span className="text-[10px] font-black text-slate-400 tracking-widest block px-4 py-2 uppercase">SETUP CATEGORIES</span>
                  <button className="w-full text-left px-4 py-3 rounded-xl text-xs font-bold bg-blue-50 text-blue-600 flex items-center space-x-2.5">
                    <span className="text-sm">🏢</span>
                    <span>Brand Book & Identidad</span>
                  </button>
                  <button className="w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50 transition-all flex items-center space-x-2.5">
                    <span className="text-sm">🎙️</span>
                    <span>Voz & Temperamento</span>
                  </button>
                  <button className="w-full text-left px-4 py-3 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50 transition-all flex items-center space-x-2.5">
                    <span className="text-sm">📖</span>
                    <span>FAQs & Catálogo</span>
                  </button>
                </aside>

                <div className="flex-1 flex overflow-hidden">
                  <form onSubmit={handleSaveConfig} className="flex-1 overflow-y-auto p-8 space-y-6 max-w-2xl bg-white border-r border-slate-200">
                    <div>
                      <h2 className="text-lg font-black text-slate-950">Configuración de Opalo Moto Gear</h2>
                      <p className="text-xs text-slate-500 font-medium mt-1">Configura las bases estratégicas e intelectuales de tu empresa. Estas variables calibrarán el comportamiento de tus agentes.</p>
                    </div>

                    <div className="space-y-4">
                      <div className="grid grid-cols-2 gap-4">
                        <div className="space-y-1.5">
                          <label className="text-[10px] font-black uppercase text-slate-500 tracking-wider">Nombre de Empresa</label>
                          <input type="text" value={companyName} onChange={e => setCompanyName(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold focus:bg-white focus:border-blue-500 focus:outline-none transition-all" />
                        </div>
                        <div className="space-y-1.5">
                          <label className="text-[10px] font-black uppercase text-slate-500 tracking-wider">Color Temático</label>
                          <div className="flex space-x-2">
                            <input type="color" value={brandColor} onChange={e => setBrandColor(e.target.value)} className="w-10 h-10 border border-slate-200 rounded-xl cursor-pointer" />
                            <input type="text" value={brandColor} onChange={e => setBrandColor(e.target.value)} className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 text-xs font-mono font-bold focus:outline-none focus:bg-white" />
                          </div>
                        </div>
                      </div>

                      <div className="space-y-1.5">
                        <label className="text-[10px] font-black uppercase text-slate-500 tracking-wider">Slogan / Propuesta de Valor</label>
                        <input type="text" value={slogan} onChange={e => setSlogan(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium focus:bg-white focus:outline-none" />
                      </div>

                      <div className="border-t border-slate-100 pt-5 mt-5">
                        <h3 className="text-sm font-bold text-slate-900 mb-4 flex items-center space-x-2">
                          <span>🎙️ Calibrador de Inteligencia de Voz</span>
                        </h3>
                        <div className="space-y-4">
                          <div className="space-y-1">
                            <div className="flex justify-between text-[11px] font-bold">
                              <span className="text-slate-600">Nivel de Formalidad</span>
                              <span className="text-blue-600">{voiceFormalidad}%</span>
                            </div>
                            <input type="range" min="0" max="100" value={voiceFormalidad} onChange={e => setVoiceFormalidad(e.target.value)} className="w-full accent-blue-600 h-1.5 bg-slate-100 rounded-lg cursor-pointer" />
                          </div>
                          <div className="space-y-1">
                            <div className="flex justify-between text-[11px] font-bold">
                              <span className="text-slate-600">Nivel de Empatía</span>
                              <span className="text-blue-600">{voiceEmpatia}%</span>
                            </div>
                            <input type="range" min="0" max="100" value={voiceEmpatia} onChange={e => setVoiceEmpatia(e.target.value)} className="w-full accent-blue-600 h-1.5 bg-slate-100 rounded-lg cursor-pointer" />
                          </div>
                        </div>
                      </div>

                      <div className="border-t border-slate-100 pt-5 mt-5">
                        <h3 className="text-sm font-bold text-slate-900 mb-3">🛠️ Misión de tus AI Employees</h3>
                        <div className="space-y-1.5">
                          <label className="text-[10px] font-black uppercase text-slate-500 tracking-wider">Mission Prompt - Sales Outbound Bot</label>
                          <textarea rows="3" value={salesBotPrompt} onChange={e => setSalesBotPrompt(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium focus:bg-white focus:outline-none resize-none" />
                        </div>
                      </div>

                      <div className="border-t border-slate-100 pt-5 mt-5">
                        <h3 className="text-sm font-bold text-slate-900 mb-3">📖 FAQs de la Empresa (Memoria Semántica)</h3>
                        <div className="space-y-1.5">
                          <label className="text-[10px] font-black uppercase text-slate-500 tracking-wider">Base de Conocimiento (Respuestas del Agente)</label>
                          <textarea rows="4" value={faqContent} onChange={e => setFAQContent(e.target.value)} required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-medium focus:bg-white focus:outline-none resize-none" />
                        </div>
                      </div>

                      <div className="pt-6">
                        <button type="submit" disabled={isSaving} className="w-full bg-slate-900 hover:bg-slate-800 disabled:bg-slate-400 text-white font-extrabold text-xs py-3.5 px-6 rounded-2xl shadow-xl transition-all flex items-center justify-center space-x-2">
                          {isSaving ? (
                            <>
                              <span className="w-4 h-4 rounded-full border-2 border-white/20 border-t-white animate-spin"></span>
                              <span>Procesando Cambios y GitOps...</span>
                            </>
                          ) : (
                            <>
                              <span>⚡</span>
                              <span>Guardar Configuración y Push GitOps</span>
                            </>
                          )}
                        </button>
                      </div>
                    </div>
                  </form>

                  <div className="flex-1 p-8 overflow-y-auto">
                    <h3 className="text-xs font-black uppercase text-slate-400 tracking-widest mb-4">PREVISUALIZACIÓN DE AGENTE EN VIVO</h3>
                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                      <div className="flex items-center space-x-3.5">
                        <div className="w-12 h-12 rounded-full flex items-center justify-center text-white font-black text-sm" style={{ backgroundColor: brandColor }}>
                          {companyName.substring(0, 2).toUpperCase()}
                        </div>
                        <div>
                          <h4 className="text-sm font-extrabold text-slate-900">{companyName} AI Assistant</h4>
                          <span className="text-[10px] font-bold text-slate-400">Calibración en Caliente</span>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-50 border border-slate-100 rounded-xl space-y-1 text-xs">
                        <p className="text-slate-500"><strong className="text-slate-700">Slogan:</strong> "{slogan}"</p>
                        <p className="text-slate-500 mt-2"><strong className="text-slate-700">FAQ Core:</strong> "{faqContent.substring(0, 100)}..."</p>
                      </div>

                      <div className="border-t border-slate-100 pt-4 font-mono text-[9px] text-slate-400 space-y-1">
                        <p>system_prompt_length: {salesBotPrompt.length} chars</p>
                        <p>voice_personality: [formalidad: {voiceFormalidad}, empatia: {voiceEmpatia}]</p>
                        <p>gitops_state: Ready to deploy</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
