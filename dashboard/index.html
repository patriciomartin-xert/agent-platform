<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Platform - Asistentes y Coworkers de IA</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- Typography & Marked.js for Markdown -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f17;
      color: #e2e8f0;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom clean scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Markdown prose styles */
    .markdown-body {
      color: #e2e8f0;
      line-height: 1.65;
    }
    .markdown-body p {
      margin-bottom: 0.75rem;
    }
    .markdown-body p:last-child {
      margin-bottom: 0;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: #f8fafc;
      font-weight: 700;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .markdown-body h1 { font-size: 1.25rem; }
    .markdown-body h2 { font-size: 1.1rem; }
    .markdown-body h3 { font-size: 1rem; }
    .markdown-body ul, .markdown-body ol {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .markdown-body ul { list-style-type: disc; }
    .markdown-body ol { list-style-type: decimal; }
    .markdown-body li {
      margin-bottom: 0.25rem;
    }
    .markdown-body strong {
      color: #ffffff;
      font-weight: 600;
    }
    .markdown-body code {
      font-family: 'JetBrains Mono', monospace;
      background-color: #1e293b;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.85em;
      color: #93c5fd;
    }
    .markdown-body pre {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      padding: 0.85rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin: 0.75rem 0;
    }
    .markdown-body pre code {
      background-color: transparent;
      padding: 0;
      color: #e2e8f0;
      font-size: 0.85rem;
    }
    .markdown-body blockquote {
      border-left: 3px solid #6366f1;
      padding-left: 0.85rem;
      color: #94a3b8;
      font-style: italic;
      margin: 0.75rem 0;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-[#0b0f17] text-slate-100">

  <div id="root" class="h-full w-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper to render Markdown safely
    function MarkdownRenderer({ content }) {
      const getHtml = () => {
        try {
          return { __html: marked.parse(content || '') };
        } catch (e) {
          return { __html: content };
        }
      };
      return <div className="markdown-body text-sm" dangerouslySetInnerHTML={getHtml()} />;
    }

    function App() {
      // Agents state
      const [agents, setAgents] = useState([]);
      const [selectedAgentId, setSelectedAgentId] = useState(null);
      const [loadingAgents, setLoadingAgents] = useState(true);

      // Chat state
      const [chatInput, setChatInput] = useState('');
      const [isSending, setIsSending] = useState(false);
      const messagesEndRef = useRef(null);
      const chatInputRef = useRef(null);

      // AI Provider & Key configuration state
      const [aiConfig, setAiConfig] = useState({ hasKey: false, keyMasked: '', provider: 'gemini', model: 'gemini-3.8-flash' });
      const [showAiModal, setShowAiModal] = useState(false);
      const [aiProvider, setAiProvider] = useState('gemini');
      const [aiKeyInput, setAiKeyInput] = useState('');
      const [aiModelInput, setAiModelInput] = useState('');
      const [aiBaseUrlInput, setAiBaseUrlInput] = useState('');
      const [aiTesting, setAiTesting] = useState(false);
      const [aiTestMessage, setAiTestMessage] = useState(null);

      // Edit Agent Drawer (Right Slide-over)
      const [showEditDrawer, setShowEditDrawer] = useState(false);
      const [editFormData, setEditFormData] = useState({
        name: '',
        role: '',
        avatarEmoji: '🤖',
        department: 'Operaciones',
        jobDescription: ''
      });
      const [isSavingAgent, setIsSavingAgent] = useState(false);
      const [editSuccessMsg, setEditSuccessMsg] = useState('');

      // Create Agent Modal
      const [showNewAgentModal, setShowNewAgentModal] = useState(false);
      const [newAgentData, setNewAgentData] = useState({
        name: '',
        role: '',
        avatarEmoji: '🤖',
        department: 'Operaciones',
        jobDescription: ''
      });
      const [isCreatingAgent, setIsCreatingAgent] = useState(false);

      // Load initial agents & AI configuration
      const fetchInitialData = async () => {
        try {
          // 1. Fetch Agents
          const res = await fetch('/api/grok/agents');
          const data = await res.json();
          if (data.success && Array.isArray(data.agents)) {
            setAgents(data.agents);
            if (data.agents.length > 0 && !selectedAgentId) {
              setSelectedAgentId(data.agents[0].id);
            }
          }

          // 2. Fetch AI Config
          const aiRes = await fetch('/api/grok/config/ai');
          const aiData = await aiRes.json();
          if (aiData.success) {
            setAiConfig(aiData);
            if (aiData.provider) setAiProvider(aiData.provider);
            if (aiData.model) setAiModelInput(aiData.model);
            if (aiData.baseUrl) setAiBaseUrlInput(aiData.baseUrl);
          }
        } catch (err) {
          console.error('[Error fetching initial data]:', err);
        } finally {
          setLoadingAgents(false);
        }
      };

      useEffect(() => {
        fetchInitialData();
      }, []);

      // Auto scroll chat to bottom
      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      const activeAgent = agents.find(a => a.id === selectedAgentId) || agents[0];

      useEffect(() => {
        scrollToBottom();
      }, [activeAgent?.history, isSending]);

      // Sync Edit Form with active agent when drawer opens or active agent changes
      useEffect(() => {
        if (activeAgent) {
          setEditFormData({
            name: activeAgent.name || '',
            role: activeAgent.role || '',
            avatarEmoji: activeAgent.avatarEmoji || '🤖',
            department: activeAgent.department || 'Operaciones',
            jobDescription: activeAgent.jobDescription || ''
          });
        }
      }, [activeAgent, showEditDrawer]);

      // Handle Send Message
      const handleSendMessage = async (e) => {
        if (e) e.preventDefault();
        const msg = chatInput.trim();
        if (!msg || isSending || !activeAgent) return;

        setChatInput('');
        setIsSending(true);

        // Optimistically add user message to history
        const userMsgObj = {
          role: 'user',
          content: msg,
          timestamp: new Date().toISOString()
        };

        setAgents(prev => prev.map(ag => {
          if (ag.id === activeAgent.id) {
            return {
              ...ag,
              history: [...(ag.history || []), userMsgObj]
            };
          }
          return ag;
        }));

        try {
          const res = await fetch('/api/grok/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              agentId: activeAgent.id,
              message: msg
            })
          });

          const data = await res.json();
          if (data.success && data.reply) {
            const assistantMsgObj = {
              role: 'assistant',
              content: data.reply,
              timestamp: new Date().toISOString()
            };

            setAgents(prev => prev.map(ag => {
              if (ag.id === activeAgent.id) {
                return {
                  ...ag,
                  history: [...(ag.history || []), assistantMsgObj]
                };
              }
              return ag;
            }));
          } else {
            // Error response
            const errorMsgObj = {
              role: 'assistant',
              content: `⚠️ ${data.error || 'No se pudo obtener respuesta del modelo.'}`,
              timestamp: new Date().toISOString()
            };
            setAgents(prev => prev.map(ag => {
              if (ag.id === activeAgent.id) {
                return {
                  ...ag,
                  history: [...(ag.history || []), errorMsgObj]
                };
              }
              return ag;
            }));
          }
        } catch (err) {
          console.error(err);
          const errorMsgObj = {
            role: 'assistant',
            content: `⚠️ Error de red: ${err.message}`,
            timestamp: new Date().toISOString()
          };
          setAgents(prev => prev.map(ag => {
            if (ag.id === activeAgent.id) {
              return {
                ...ag,
                history: [...(ag.history || []), errorMsgObj]
              };
            }
            return ag;
          }));
        } finally {
          setIsSending(false);
          chatInputRef.current?.focus();
        }
      };

      // Handle Save Agent Edits
      const handleSaveAgent = async (e) => {
        e.preventDefault();
        if (!activeAgent) return;
        setIsSavingAgent(true);
        setEditSuccessMsg('');

        try {
          const res = await fetch(`/api/grok/agents/${activeAgent.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: editFormData.name,
              role: editFormData.role,
              avatarEmoji: editFormData.avatarEmoji,
              department: editFormData.department,
              jobDescription: editFormData.jobDescription
            })
          });

          const data = await res.json();
          if (data.success) {
            setAgents(prev => prev.map(ag => ag.id === activeAgent.id ? data.agent : ag));
            setEditSuccessMsg('✅ ¡Agente actualizado con éxito!');
            setTimeout(() => setEditSuccessMsg(''), 3000);
          }
        } catch (err) {
          console.error(err);
          alert('Error al guardar agente: ' + err.message);
        } finally {
          setIsSavingAgent(false);
        }
      };

      // Handle Delete Agent
      const handleDeleteAgent = async () => {
        if (!activeAgent) return;
        if (!confirm(`¿Estás seguro de eliminar a "${activeAgent.name}"?`)) return;

        try {
          const res = await fetch(`/api/grok/agents/${activeAgent.id}`, {
            method: 'DELETE'
          });
          const data = await res.json();
          if (data.success) {
            const remaining = agents.filter(a => a.id !== activeAgent.id);
            setAgents(remaining);
            if (remaining.length > 0) {
              setSelectedAgentId(remaining[0].id);
            }
            setShowEditDrawer(false);
          }
        } catch (err) {
          alert('Error al eliminar agente: ' + err.message);
        }
      };

      // Handle Create New Agent
      const handleCreateAgent = async (e) => {
        e.preventDefault();
        if (!newAgentData.name.trim()) return;
        setIsCreatingAgent(true);

        try {
          const res = await fetch('/api/grok/agents', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: newAgentData.name.trim(),
              role: newAgentData.role.trim() || 'Especialista Autónomo',
              avatarEmoji: newAgentData.avatarEmoji || '🤖',
              department: newAgentData.department || 'Operaciones',
              jobDescription: newAgentData.jobDescription || `Eres ${newAgentData.name}, asistente especializado.`
            })
          });

          const data = await res.json();
          if (data.success && data.agent) {
            setAgents(prev => [...prev, data.agent]);
            setSelectedAgentId(data.agent.id);
            setShowNewAgentModal(false);
            setNewAgentData({
              name: '',
              role: '',
              avatarEmoji: '🤖',
              department: 'Operaciones',
              jobDescription: ''
            });
          }
        } catch (err) {
          alert('Error al crear agente: ' + err.message);
        } finally {
          setIsCreatingAgent(false);
        }
      };

      // Save & Test AI Configuration
      const handleSaveAiConfig = async () => {
        if (!aiKeyInput.trim() && !aiConfig.hasKey) return;
        setAiTesting(true);
        setAiTestMessage(null);

        try {
          const res = await fetch('/api/grok/config/ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: aiProvider,
              apiKey: aiKeyInput.trim(),
              model: aiModelInput.trim(),
              baseUrl: aiBaseUrlInput.trim()
            })
          });

          const data = await res.json();
          if (data.success) {
            if (data.testResult && data.testResult.success) {
              setAiConfig({
                hasKey: true,
                keyMasked: data.keyMasked,
                provider: data.provider || aiProvider,
                model: data.testResult.model || aiModelInput
              });
              setAiTestMessage({ type: 'success', text: `✅ Conectado y Verificado: ${data.testResult.message}` });
            } else {
              setAiTestMessage({ type: 'error', text: `⚠️ ${data.testResult?.error || 'Clave no válida o error de conexión'}` });
            }
          } else {
            setAiTestMessage({ type: 'error', text: data.error || 'Error al guardar la clave' });
          }
        } catch (err) {
          setAiTestMessage({ type: 'error', text: err.message });
        } finally {
          setAiTesting(false);
        }
      };

      // Clear current agent chat history
      const handleClearHistory = () => {
        if (!activeAgent) return;
        if (!confirm(`¿Deseas reiniciar la conversación con ${activeAgent.name}?`)) return;

        setAgents(prev => prev.map(ag => {
          if (ag.id === activeAgent.id) {
            return {
              ...ag,
              history: [
                {
                  role: 'assistant',
                  content: `Conversación reiniciada. Hola, soy **${ag.name}** (${ag.role}). ¿En qué puedo ayudarte?`,
                  timestamp: new Date().toISOString()
                }
              ]
            };
          }
          return ag;
        }));
      };

      return (
        <div className="h-screen w-screen flex flex-col bg-[#090d16] text-slate-100 overflow-hidden select-none">
          
          {/* ============================================================= */}
          {/* TOPBAR / HEADER                                               */}
          {/* ============================================================= */}
          <header className="h-14 border-b border-slate-800/80 bg-[#0e1422] px-4 flex items-center justify-between shrink-0 z-20">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-lg shadow-sm">
                ⚡
              </div>
              <div>
                <h1 className="text-sm font-bold text-white tracking-tight flex items-center space-x-2">
                  <span>Agent Platform</span>
                  <span className="text-[10px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded-full font-mono font-medium">v2.0</span>
                </h1>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              {/* Botón de Conexión de IA */}
              <button
                onClick={() => {
                  setAiTestMessage(null);
                  setShowAiModal(true);
                }}
                className={`flex items-center space-x-2 px-3 py-1.5 rounded-xl text-xs font-mono border transition-all ${
                  aiConfig.hasKey
                    ? 'bg-emerald-950/40 text-emerald-300 border-emerald-500/40 hover:bg-emerald-900/50'
                    : 'bg-amber-950/40 text-amber-300 border-amber-500/40 hover:bg-amber-900/50 animate-pulse'
                }`}
                title="Configurar LLM (Gemini, OpenAI, Claude, etc.)"
              >
                <span className={`w-2 h-2 rounded-full ${aiConfig.hasKey ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                <span className="font-semibold uppercase tracking-wider text-[11px]">
                  {aiConfig.hasKey ? `${aiConfig.provider || 'Gemini'} Conectado` : '⚡ Conectar API Key'}
                </span>
                <span className="text-xs opacity-60">⚙️</span>
              </button>

              {/* Botón Nuevo Agente */}
              <button
                onClick={() => setShowNewAgentModal(true)}
                className="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs px-3 py-1.5 rounded-xl transition-all shadow shadow-indigo-600/20 flex items-center space-x-1.5"
              >
                <span>+</span>
                <span>Nuevo Agente</span>
              </button>
            </div>
          </header>

          {/* ============================================================= */}
          {/* MAIN CONTAINER: SIDEBAR + CHAT VIEW                          */}
          {/* ============================================================= */}
          <div className="flex-1 flex overflow-hidden relative">

            {/* --- SIDEBAR: AGENTS LIST --- */}
            <aside className="w-72 border-r border-slate-800/80 bg-[#0c111d] flex flex-col shrink-0 select-none">
              
              <div className="p-3 border-b border-slate-800/60 flex items-center justify-between text-xs text-slate-400">
                <span className="font-semibold text-slate-300 uppercase tracking-wider text-[11px]">Coworkers & Agentes</span>
                <span className="font-mono bg-slate-800/80 px-2 py-0.5 rounded-md text-[10px]">{agents.length}</span>
              </div>

              {/* Agents Scrollable List */}
              <div className="flex-1 overflow-y-auto p-2 space-y-1">
                {loadingAgents ? (
                  <div className="p-4 text-center text-xs text-slate-500">Cargando agentes...</div>
                ) : agents.length === 0 ? (
                  <div className="p-4 text-center text-xs text-slate-500">No hay agentes creados.</div>
                ) : (
                  agents.map(agent => {
                    const isSelected = selectedAgentId === agent.id;
                    return (
                      <div
                        key={agent.id}
                        onClick={() => setSelectedAgentId(agent.id)}
                        className={`group relative flex items-center justify-between p-2.5 rounded-xl cursor-pointer transition-all border ${
                          isSelected
                            ? 'bg-indigo-950/40 border-indigo-500/40 text-white shadow-sm'
                            : 'bg-transparent border-transparent text-slate-300 hover:bg-slate-800/40 hover:text-white'
                        }`}
                      >
                        <div className="flex items-center space-x-3 overflow-hidden">
                          <div className="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700/50 flex items-center justify-center text-lg shrink-0">
                            {agent.avatarEmoji || '🤖'}
                          </div>
                          <div className="overflow-hidden">
                            <div className="text-xs font-semibold truncate leading-tight">{agent.name}</div>
                            <div className="text-[11px] text-slate-400 truncate mt-0.5">{agent.role}</div>
                          </div>
                        </div>

                        {/* Quick Edit Action on Hover */}
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            setSelectedAgentId(agent.id);
                            setShowEditDrawer(true);
                          }}
                          className={`p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700/50 transition-all ${
                            isSelected ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'
                          }`}
                          title="Editar Agente"
                        >
                          ✏️
                        </button>
                      </div>
                    );
                  })
                )}
              </div>

              {/* Sidebar Footer Info */}
              <div className="p-3 border-t border-slate-800/60 text-[11px] text-slate-400 flex items-center justify-between bg-[#0a0e18]">
                <div className="flex items-center space-x-2">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="font-mono truncate">{aiConfig.model || 'Gemini 3.8 Flash'}</span>
                </div>
                <button
                  onClick={() => setShowAiModal(true)}
                  className="text-indigo-400 hover:underline font-mono"
                >
                  Cambiar
                </button>
              </div>
            </aside>

            {/* --- MAIN CHAT AREA --- */}
            <main className="flex-1 flex flex-col bg-[#090d16] overflow-hidden">
              {activeAgent ? (
                <>
                  {/* Active Agent Header Bar */}
                  <div className="h-14 border-b border-slate-800/80 bg-[#0c111d]/60 backdrop-blur px-5 flex items-center justify-between shrink-0">
                    <div className="flex items-center space-x-3">
                      <div className="w-8 h-8 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-lg">
                        {activeAgent.avatarEmoji || '🤖'}
                      </div>
                      <div>
                        <div className="flex items-center space-x-2">
                          <h2 className="text-sm font-bold text-white">{activeAgent.name}</h2>
                          <span className="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-mono">
                            {activeAgent.role}
                          </span>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center space-x-2">
                      <button
                        onClick={handleClearHistory}
                        className="text-xs text-slate-400 hover:text-slate-200 px-2.5 py-1.5 rounded-lg hover:bg-slate-800 transition-all flex items-center space-x-1"
                        title="Limpiar conversación actual"
                      >
                        <span>🗑️</span>
                        <span className="hidden sm:inline">Reiniciar</span>
                      </button>

                      <button
                        onClick={() => setShowEditDrawer(true)}
                        className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5 shadow-sm"
                        title="Editar nombre, rol e instrucciones de este agente"
                      >
                        <span>✏️</span>
                        <span>Editar Agente</span>
                      </button>
                    </div>
                  </div>

                  {/* Chat Messages Feed */}
                  <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-5">
                    {/* Welcome Banner if only 1 message */}
                    {(!activeAgent.history || activeAgent.history.length <= 1) && (
                      <div className="max-w-2xl mx-auto my-4 p-5 rounded-2xl bg-[#0f1626] border border-slate-800 text-center space-y-3">
                        <div className="text-3xl">{activeAgent.avatarEmoji || '🤖'}</div>
                        <h3 className="text-base font-bold text-white">{activeAgent.name}</h3>
                        <p className="text-xs text-slate-400 leading-relaxed max-w-md mx-auto">
                          {activeAgent.jobDescription || 'Listo para operar con autonomía y ayudarte en tus tareas.'}
                        </p>
                        <div className="pt-2 flex flex-wrap gap-2 justify-center">
                          {[
                            '¿Cuál es tu función principal?',
                            'Ayúdame a organizar mis prioridades de hoy',
                            '¿Cómo podemos optimizar el trabajo?'
                          ].map((prompt, idx) => (
                            <button

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
