<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok Bot - Autonomous Persistent AI Teammates OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #e2e8f0;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 99px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-ring {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex antialiased overflow-hidden select-none">

  <div id="root" class="flex-1 flex overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Global State
      const [agents, setAgents] = useState({});
      const [selectedAgentId, setSelectedAgentId] = useState('el-jefazo');
      const [channels, setChannels] = useState([]);
      const [selectedChannel, setSelectedChannel] = useState('all');
      const [routines, setRoutines] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [interAgentLogs, setInterAgentLogs] = useState([]);

      // Right Column Tabs: 'computer' | 'routines' | 'settings' | 'plugins'
      const [rightTab, setRightTab] = useState('computer');

      // Chat input & voice recording
      const [chatInput, setChatInput] = useState('');
      const [isRecording, setIsRecording] = useState(false);
      const [isSending, setIsSending] = useState(false);
      const [speechSupported, setSpeechSupported] = useState(false);

      // Computer address bar
      const [browserUrl, setBrowserUrl] = useState('https://soloemprendo.com');

      // Modals
      const [showNewAgentModal, setShowNewAgentModal] = useState(false);
      const [showNewRoutineModal, setShowNewRoutineModal] = useState(false);
      const [newAgentForm, setNewAgentForm] = useState({ name: '', role: '', channelId: 'solo-emprendo', jobDescription: '', avatarEmoji: '🤖' });
      const [newRoutineForm, setNewRoutineForm] = useState({ title: '', scheduleLabel: 'Cada día a las 9:00 AM', schedule: '0 9 * * *', instruction: '' });

      const chatEndRef = useRef(null);
      const recognitionRef = useRef(null);

      // Initial Data Loading & WebSockets
      useEffect(() => {
        loadInitialData();
        initWebSocket();
        initSpeechRecognition();
      }, []);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [agents, selectedAgentId]);

      // Sync browser URL with active agent
      useEffect(() => {
        const ag = agents[selectedAgentId];
        if (ag && ag.computer) {
          setBrowserUrl(ag.computer.currentUrl || 'https://soloemprendo.com');
        }
      }, [selectedAgentId, agents]);

      const loadInitialData = async () => {
        try {
          const [agRes, chRes, roRes, exRes, loRes] = await Promise.all([
            fetch('/api/grok/agents').then(r => r.json()),
            fetch('/api/grok/channels').then(r => r.json()),
            fetch('/api/grok/routines').then(r => r.json()),
            fetch('/api/grok/expenses').then(r => r.json()),
            fetch('/api/grok/inter-agent-logs').then(r => r.json())
          ]);

          if (agRes.success) {
            const map = {};
            agRes.agents.forEach(a => { map[a.id] = a; });
            setAgents(map);
          }
          if (chRes.success) setChannels(chRes.channels);
          if (roRes.success) setRoutines(roRes.routines);
          if (exRes.success) setExpenses(exRes.expenses);
          if (loRes.success) setInterAgentLogs(loRes.logs);
        } catch (err) {
          console.error('[Error loading Grok Bot data]:', err);
        }
      };

      const initWebSocket = () => {
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

        ws.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.event === 'grok_initial_state') {
              const map = {};
              (data.agents || []).forEach(a => { map[a.id] = a; });
              setAgents(map);
              if (data.channels) setChannels(data.channels);
              if (data.routines) setRoutines(data.routines);
              if (data.expenses) setExpenses(data.expenses);
              if (data.interAgentLogs) setInterAgentLogs(data.interAgentLogs);
            } else if (data.event === 'agent_created' || data.event === 'agent_updated') {
              setAgents(prev => ({ ...prev, [data.agent.id]: data.agent }));
            } else if (data.event === 'new_agent_message') {
              setAgents(prev => {
                const target = prev[data.agentId];
                if (!target) return prev;
                return {
                  ...prev,
                  [data.agentId]: {
                    ...target,
                    history: [...(target.history || []), data.message]
                  }
                };
              });
            } else if (data.event === 'routine_created') {
              setRoutines(prev => [data.routine, ...prev]);
            } else if (data.event === 'routine_executed') {
              setRoutines(prev => prev.map(r => r.id === data.routine.id ? data.routine : r));
            } else if (data.event === 'inter_agent_message') {
              setInterAgentLogs(prev => [data.log, ...prev]);
            } else if (data.event === 'expense_registered') {
              setExpenses(prev => [data.expense, ...prev]);
            }
          } catch (e) {
            console.error('[WS Parse error]:', e);
          }
        };
      };

      const initSpeechRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          setSpeechSupported(true);
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.lang = 'es-ES';

          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setChatInput(prev => (prev ? prev + ' ' + transcript : transcript));
            setIsRecording(false);
          };

          recognition.onerror = () => setIsRecording(false);
          recognition.onend = () => setIsRecording(false);
          recognitionRef.current = recognition;
        }
      };

      const toggleVoiceRecording = () => {
        if (!recognitionRef.current) {
          alert('Tu navegador no soporta Web Speech API. Puedes escribir directamente.');
          return;
        }
        if (isRecording) {
          recognitionRef.current.stop();
          setIsRecording(false);
        } else {
          try {
            recognitionRef.current.start();
            setIsRecording(true);
          } catch (e) {
            console.error(e);
          }
        }
      };

      // Send chat message
      const handleSendMessage = async (customText = null, attachment = null) => {
        const text = customText || chatInput;
        if (!text.trim() && !attachment) return;

        setChatInput('');
        setIsSending(true);

        try {
          const res = await fetch('/api/grok/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              agentId: selectedAgentId,
              message: text || (attachment === 'ticket' ? 'Te adjunto este ticket de gasto de 70.18€ para que lo registres.' : 'Te adjunto el briefing de Solo Emprendo.'),
              attachment
            })
          });
          const data = await res.json();
          // Reload fresh data to update agents and sheets
          loadInitialData();
        } catch (err) {
          console.error('[Error sending message]:', err);
        } finally {
          setIsSending(false);
        }
      };

      // Run routine on demand
      const handleRunRoutine = async (routineId) => {
        try {
          const res = await fetch(`/api/grok/routines/${routineId}/run`, { method: 'POST' });
          const data = await res.json();
          if (data.success) {
            loadInitialData();
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Save new agent
      const handleCreateAgentSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/grok/agents', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newAgentForm)
          });
          const data = await res.json();
          if (data.success) {
            setShowNewAgentModal(false);
            setSelectedAgentId(data.agent.id);
            loadInitialData();
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Save new routine
      const handleCreateRoutineSubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/grok/routines', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              agentId: selectedAgentId,
              ...newRoutineForm
            })
          });
          const data = await res.json();
          if (data.success) {
            setShowNewRoutineModal(false);
            loadInitialData();
          }
        } catch (err) {
          console.error(err);
        }
      };

      // Filtered agents by channel
      const filteredAgents = Object.values(agents).filter(ag => {
        if (selectedChannel === 'all') return true;
        return ag.channelId === selectedChannel;
      });

      const coordinator = Object.values(agents).find(a => a.isCoordinator) || agents['el-jefazo'];
      const activeAgent = agents[selectedAgentId] || coordinator || { name: 'Grok Bot', role: 'Asistente' };
      const agentRoutines = routines.filter(r => r.agentId === selectedAgentId);

      return (
        <div className="flex-1 flex flex-col h-screen bg-[#070a0f] text-slate-200 overflow-hidden">
          
          {/* TOP BAR / BRAND HEADER */}
          <header className="h-14 bg-[#0d121d] border-b border-slate-800/80 px-5 flex justify-between items-center shrink-0 z-20">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 via-blue-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20 font-black text-white text-base">
                𝕏
              </div>
              <div className="flex items-baseline space-x-2">
                <span className="font-extrabold text-sm tracking-tight text-white flex items-center">
                  Grok Bot <span className="text-cyan-400 font-mono text-xs ml-1.5 font-semibold">OS v3.8</span>
                </span>
                <span className="text-[10px] text-slate-400 font-mono bg-slate-800/70 border border-slate-700/60 px-2 py-0.5 rounded-md">
                  Persistent Autonomous Teammates
                </span>
              </div>
            </div>

            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-xl text-xs font-mono text-slate-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>{Object.keys(agents).length} Agentes Persistentes</span>
                <span className="text-slate-600">|</span>
                <span className="text-cyan-400">{routines.length} Rutinas 24/7</span>
              </div>

              <div className="flex items-center space-x-2 border-l border-slate-800 pl-4">
                <div className="w-7 h-7 rounded-full bg-indigo-600/30 border border-indigo-500/40 text-indigo-300 font-bold text-xs flex items-center justify-center">
                  J
                </div>
                <div className="text-left leading-none">
                  <span className="text-xs font-bold text-slate-200">José</span>
                  <span className="text-[9px] text-slate-500 block font-mono">soloemprendo.com</span>
                </div>
              </div>
            </div>
          </header>

          {/* 3-COLUMN MASTER LAYOUT */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* ============================================================= */}
            {/* COLUMN 1: LEFT SIDEBAR (WHATSAPP-STYLE AGENTS & CHANNELS)     */}
            {/* ============================================================= */}
            <aside className="w-80 bg-[#0d121d] border-r border-slate-800/80 flex flex-col shrink-0">
              
              {/* Channel / Project Selector */}
              <div className="p-3.5 border-b border-slate-800/80">
                <div className="flex justify-between items-center mb-2 px-1">
                  <span className="text-[10px] font-black tracking-widest uppercase text-slate-400 font-mono">PROYECTOS / CANALES</span>
                  <button onClick={() => setShowNewAgentModal(true)} className="text-[11px] font-bold text-cyan-400 hover:text-cyan-300 flex items-center space-x-1">
                    <span>+</span>
                    <span>Nuevo Bot</span>
                  </button>
                </div>
                
                <div className="flex space-x-1.5 overflow-x-auto custom-scrollbar pb-1">
                  {channels.map(ch => (
                    <button
                      key={ch.id}
                      onClick={() => setSelectedChannel(ch.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all flex items-center space-x-1.5 ${
                        selectedChannel === ch.id
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                          : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                      }`}
                    >
                      <span>{ch.icon}</span>
                      <span>{ch.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              {/* Coordinator Agent (Pinned at Top: El Jefazo) */}
              {coordinator && (
                <div className="p-3 bg-gradient-to-b from-indigo-950/30 to-transparent border-b border-slate-800/80">
                  <span className="text-[9px] font-black uppercase tracking-wider text-indigo-400 px-2 block mb-1 font-mono">
                    COORDINADOR GENERAL (JERARQUÍA MÁXIMA)
                  </span>
                  
                  <button
                    onClick={() => setSelectedAgentId(coordinator.id)}
                    className={`w-full text-left p-3 rounded-2xl transition-all flex items-center space-x-3.5 border ${
                      selectedAgentId === coordinator.id
                        ? 'bg-indigo-600/20 border-indigo-500/60 text-white shadow-lg shadow-indigo-500/10'
                        : 'bg-slate-900/60 border-slate-800/80 hover:bg-slate-800/60 text-slate-300'
                    }`}
                  >
                    <div className="relative">
                      <div className="w-12 h-12 rounded-2xl bg-indigo-900/40 border border-indigo-500/40 flex items-center justify-center text-2xl overflow-hidden shadow-inner">
                        {coordinator.avatarEmoji || '🧔🏻'}
                      </div>
                      <span className="absolute -bottom-1 -right-1 w-4 h-4 rounded-full bg-emerald-500 border-2 border-[#0d121d] flex items-center justify-center">
                        <span className="w-1.5 h-1.5 rounded-full bg-white pulse-ring"></span>
                      </span>
                    </div>

                    <div className="flex-1 min-w-0">
                      <div className="flex justify-between items-baseline">
                        <h3 className="text-xs font-black text-white truncate">{coordinator.name}</h3>
                        <span className="text-[9px] text-cyan-400 font-mono font-bold bg-cyan-950/60 px-1.5 py-0.5 rounded">Jefe</span>
                      </div>
                      <p className="text-[11px] text-slate-400 truncate mt-0.5 font-medium">{coordinator.role}</p>
                      <div className="mt-1 flex items-center space-x-1">
                        <span className="text-[8px] font-mono text-emerald-400 bg-emerald-950/50 px-1.5 py-0.2 rounded border border-emerald-800/40">Autónomo 24/7</span>
                        <span className="text-[8px] font-mono text-indigo-300 bg-indigo-950/50 px-1.5 py-0.2 rounded border border-indigo-800/40">Crea Equipos</span>
                      </div>
                    </div>
                  </button>
                </div>
              )}

              {/* Specialized Workers List */}
              <div className="p-2.5 px-3">
                <span className="text-[9px] font-black uppercase tracking-wider text-slate-500 font-mono">
                  EQUIPO DE TRABAJADORES ESPECIALIZADOS ({filteredAgents.filter(a => !a.isCoordinator).length})
                </span>
              </div>

              <div className="flex-1 overflow-y-auto divide-y divide-slate-800/40 custom-scrollbar px-2 space-y-1">
                {filteredAgents
                  .filter(a => !a.isCoordinator)
                  .map(ag => (
                    <button
                      key={ag.id}
                      onClick={() => setSelectedAgentId(ag.id)}
                      className={`w-full text-left p-2.5 rounded-xl transition-all flex items-center space-x-3 border ${
                        selectedAgentId === ag.id
                          ? 'bg-slate-800 border-indigo-500/50 text-white shadow-md'
                          : 'bg-transparent border-transparent hover:bg-slate-850 hover:border-slate-800 text-slate-300'
                      }`}
                    >
                      <div className="relative">
                        <div className="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center text-xl shrink-0">
                          {ag.avatarEmoji || '🤖'}
                        </div>
                        <span className={`absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-[#0d121d] ${
                          ag.status === 'online' ? 'bg-emerald-500' : 'bg-amber-500'
                        }`} />
                      </div>

                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-baseline">
                          <h4 className={`text-xs font-bold truncate ${selectedAgentId === ag.id ? 'text-white' : 'text-slate-200'}`}>
                            {ag.name}
                          </h4>
                          <span className="text-[9px] font-mono text-slate-500">
                            {ag.computer?.activeTab || 'ordenador'}
                          </span>
                        </div>
                        <p className="text-[10px] text-slate-400 truncate mt-0.5">{ag.role}</p>
                        
                        <div className="mt-1 flex items-center space-x-1">
                          {(ag.tags || []).slice(0, 2).map((t, idx) => (
                            <span key={idx} className="text-[8px] font-mono text-slate-400 bg-slate-800/80 px-1.5 py-0.5 rounded">
                              {t}
                            </span>
                          ))}
                        </div>
                      </div>
                    </button>
                  ))}
              </div>

              {/* Bottom Inter-Agent Supervision Ticker */}
              <div className="p-3 bg-[#090d15] border-t border-slate-800/80 text-[10px] font-mono text-slate-400 space-y-1 shrink-0">
                <div className="flex justify-between items-center">
                  <span className="text-cyan-400 font-bold uppercase text-[9px]">Supervisión Inter-Agentes</span>
                  <span className="text-[8px] text-slate-500 font-mono">Live Back-Channel</span>
                </div>
                <div className="truncate text-slate-300">
                  {interAgentLogs.length > 0 ? (
                    <span className="text-emerald-400">↳ {interAgentLogs[0].fromName} ➔ {interAgentLogs[0].toName}: "{interAgentLogs[0].content.substring(0, 40)}..."</span>
                  ) : (
                    <span>Esperando reportes entre bots...</span>
                  )}
                </div>
              </div>
            </aside>

            {/* ============================================================= */}
            {/* COLUMN 2: CENTER PANEL (THE ACTIVE CONVERSATION & CHAT)      */}
            {/* ============================================================= */}
            <main className="flex-1 flex flex-col bg-[#0b0f17] overflow-hidden border-r border-slate-800/80">
              
              {/* Active Agent Header */}
              <div className="h-16 bg-[#0e1320] border-b border-slate-800/80 px-6 flex justify-between items-center shrink-0">
                <div className="flex items-center space-x-3.5">
                  <div className="w-10 h-10 rounded-2xl bg-indigo-950/60 border border-indigo-500/40 flex items-center justify-center text-xl shadow">
                    {activeAgent.avatarEmoji || '🤖'}
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <h2 className="text-sm font-extrabold text-white">{activeAgent.name}</h2>
                      <span className="text-[9px] font-mono uppercase bg-slate-800 text-cyan-400 px-2 py-0.5 rounded border border-slate-700">
                        {activeAgent.isCoordinator ? 'Coordinador General' : 'Especialista'}
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 font-medium mt-0.5">{activeAgent.role}</p>
                  </div>
                </div>

                <div className="flex items-center space-x-2.5">
                  {/* Quick Action Pills based on the video */}
                  {activeAgent.isCoordinator && (
                    <button
                      onClick={() => handleSendMessage('Te subo el briefing de Solo Emprendo para que lo analices y me sugieras un equipo de tres trabajadores.')}
                      className="text-xs font-bold bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 px-3 py-1.5 rounded-xl transition-all flex items-center space-x-1.5"
                    >
                      <span>📄</span>
                      <span>Subir Briefing Solo Emprendo</span>
                    </button>
                  )}

                  {activeAgent.id === 'el-investigador' && (
                    <>
                      <button
                        onClick={() => handleSendMessage('Investiga en Twitter/X y dame las 3 principales novedades de IA aplicada a empresas sin listas infinitas.')}
                        className="text-xs font-bold bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/40 px-3 py-1.5 rounded-xl transition-all flex items-center space-x-1.5"
                      >
                        <span>🔍</span>
                        <span>3 Píldoras de IA</span>
                      </button>
                      <button
                        onClick={() => handleSendMessage('Quiero que este flujo de trabajo lo hagas cada día a las 9 de la mañana.')}
                        className="text-xs font-bold bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-xl transition-all flex items-center space-x-1.5"
                      >
                        <span>⏱️</span>
                        <span>Crear Rutina 9:00 AM</span>
                      </button>
                      <button
                        onClick={() => handleSendMessage('Reporta al Jefazo que ya hiciste tu primer trabajo y que te lo califiqué con 10 sobre 10.')}
                        className="text-xs font-bold bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 px-3 py-1.5 rounded-xl transition-all flex items-center space-x-1.5"
                      >
                        <span>📈</span>
                        <span>Reportar al Jefazo (10/10)</span>
                      </button>
                    </>
                  )}

                  {activeAgent.id === 'joaquin-admin' && (
                    <button
                      onClick={() => handleSendMessage('Te subo este ticket de gasto de restaurante por 70.18€ para que extraigas los datos fiscales y lo añadas al Excel.', 'ticket')}
                      className="text-xs font-bold bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/40 px-3 py-1.5 rounded-xl transition-all flex items-center space-x-1.5"
                    >
                      <span>🧾</span>
                      <span>Subir Ticket de Gasto (70.18€)</span>
                    </button>
                  )}

                  <div className="h-6 w-px bg-slate-800"></div>

                  <span className="text-[10px] font-mono text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-2.5 py-1 rounded-xl flex items-center space-x-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>Activo 24/7</span>

                      value={newAgentForm.role}
                      onChange={e => setNewAgentForm({ ...newAgentForm, role: e.target.value })}
                      className="w-full bg-[#131a29] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-mono uppercase text-slate-400">Job Description</label>
                    <textarea
                      rows="3"
                      required
                      placeholder="Instrucciones claras de las tareas que desarrollará..."
                      value={newAgentForm.jobDescription}
                      onChange={e => setNewAgentForm({ ...newAgentForm, jobDescription: e.target.value })}
                      className="w-full bg-[#131a29] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none text-[11px] resize-none"
                    />
                  </div>

                  <div className="pt-2 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setShowNewAgentModal(false)}
                      className="px-4 py-2 rounded-xl text-slate-400 hover:text-white font-mono text-xs"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs font-mono shadow"
                    >
                      Crear Agente
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ============================================================= */}
          {/* MODAL: CREAR NUEVA RUTINA (CRON JOB)                          */}
          {/* ============================================================= */}
          {showNewRoutineModal && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0e1320] border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="text-sm font-extrabold text-white">Programar Rutina 24/7 (Cron Job)</h3>
                  <button onClick={() => setShowNewRoutineModal(false)} className="text-slate-400 hover:text-white font-mono text-xs">✕</button>
                </div>

                <form onSubmit={handleCreateRoutineSubmit} className="space-y-3 text-xs">
                  <div>
                    <label className="text-[10px] font-mono uppercase text-slate-400">Título de la Rutina</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej: Resumen matutino de noticias"
                      value={newRoutineForm.title}
                      onChange={e => setNewRoutineForm({ ...newRoutineForm, title: e.target.value })}
                      className="w-full bg-[#131a29] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-mono uppercase text-slate-400">Frecuencia / Horario</label>
                    <input
                      type="text"
                      required
                      placeholder="Ej: Cada día a las 9:00 AM"
                      value={newRoutineForm.scheduleLabel}
                      onChange={e => setNewRoutineForm({ ...newRoutineForm, scheduleLabel: e.target.value })}
                      className="w-full bg-[#131a29] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-mono uppercase text-slate-400">Instrucción para el Bot</label>
                    <textarea
                      rows="3"
                      required
                      placeholder="Qué debe hacer el agente en cada ejecución..."
                      value={newRoutineForm.instruction}
                      onChange={e => setNewRoutineForm({ ...newRoutineForm, instruction: e.target.value })}
                      className="w-full bg-[#131a29] border border-slate-800 rounded-xl p-2.5 mt-1 text-slate-200 focus:outline-none text-[11px] resize-none"
                    />
                  </div>

                  <div className="pt-2 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setShowNewRoutineModal(false)}
                      className="px-4 py-2 rounded-xl text-slate-400 hover:text-white font-mono text-xs"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs font-mono shadow"
                    >
                      Programar Rutina
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
